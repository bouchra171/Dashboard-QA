<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard QA</title>
  <link rel="stylesheet" href="./assets/omnes-consulting.css">
  <style>
    :root {
      --color-primary: #5B3FA3;
      --color-primary-light: #EFE8FF;
      --color-primary-dark: #4A3287;
      --color-secondary: #6F6680;
      --color-secondary-light: #F4F0FF;
      --color-success: #267A52;
      --color-success-light: #EAF7F0;
      --color-error: #9B4D63;
      --color-error-light: #FAEEF2;
      --color-warning: #8A6A3F;
      --color-warning-light: #FAF3E7;
      --color-text-primary: #241B3A;
      --color-text-secondary: #6F6680;
      --color-text-muted: #6F6680;
      --color-bg-primary: #FFFEFF;
      --color-bg-secondary: #FAF8FF;
      --color-bg-tertiary: #F4F0FF;
      --color-border: #E6DDF5;
      --color-border-light: #D9CDEF;
      --color-nav-bg-start: #FFFEFF;
      --color-nav-bg-end: #FFFEFF;
      --color-nav-text: #6F6680;
      --color-nav-text-hover: #5B3FA3;
      --color-nav-active-bg: #EFE8FF;
      --color-nav-active-border: #5B3FA3;
      --shadow-sm: 0 1px 2px rgba(91, 63, 163, .05);
      --shadow-md: 0 6px 16px rgba(91, 63, 163, .07);
      --shadow-lg: 0 16px 34px rgba(91, 63, 163, .09);
      --shadow-xl: 0 24px 50px rgba(91, 63, 163, .12);

      /* ★ Anciennes variables pour compatibilité */
      --bg: var(--color-bg-secondary);
      --panel: var(--color-bg-primary);
      --ink: var(--color-text-primary);
      --muted: var(--color-text-muted);
      --line: var(--color-border);
      --purple: var(--color-primary);
      --purple-soft: var(--color-primary-light);
      --ok: var(--color-success);
      --ok-soft: var(--color-success-light);
      --ko: var(--color-error);
      --ko-soft: var(--color-error-light);
      --blocked: var(--color-warning);
      --blocked-soft: var(--color-warning-light);
      --shadow: var(--shadow-lg);
    }

    * { box-sizing: border-box; }
    body {
      margin: auto 0 0;
      background: var(--color-bg-secondary);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 206px minmax(0, 1fr); }
    aside {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--color-nav-bg-start) 0%, var(--color-nav-bg-end) 100%);
      padding: 24px 12px 18px;
      color: var(--color-nav-text);
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 2px 0 12px rgba(0, 0, 0, .08);
    }
    .brand { display: grid; place-items: center; padding: 8px 6px 20px; }
    .brand img { width: 128px; display: block; opacity: .92; }
    .nav { display: grid; gap: 7px; }
    .nav a, .nav-title {
      height: 46px; border-radius: 8px; color: rgba(255,255,255,.85);
      display: grid; grid-template-columns: 1fr 14px; align-items: center;
      padding: 0 12px; text-decoration: none; font-size: 12px; font-weight: 700;
      transition: all .2s ease;
      width: 100%; border: 0; background: transparent; font-family: inherit; text-align: left; cursor: pointer;
    }
    .nav a:not(.has-caret) { grid-template-columns: 1fr; }
    .nav a:hover, .nav-title:hover { background: rgba(255,255,255,.1); color: var(--color-nav-text-hover); }
    .nav a.active {
      background: var(--color-nav-active-bg);
      color: var(--color-nav-text-hover);
      box-shadow: inset 3px 0 0 var(--color-nav-active-border), 0 0 0 1px rgba(255,255,255,.1);
    }
    .icon { display: none; }
    .subnav { display: grid; gap: 4px; padding-left: 38px; }
    .subnav.collapsed { display: none; }
    .subnav a, .subnav span { min-height: 32px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; color: rgba(255,255,255,.78); font-size: 12px; font-weight: 700; text-decoration: none; transition: all .15s ease; }
    .subnav a:hover { background: rgba(255,255,255,.12); color: var(--color-nav-text-hover); }
    .subnav a.active { background: rgba(255,255,255,.12); color: var(--color-nav-text-hover); }
    .subnav span { opacity: .48; }

    main { min-width: 0; min-height: 100vh; }
    main.detail-open { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
    .page { padding: 34px 36px 34px; min-width: 0; background: var(--color-bg-secondary); }
    .detail { display: none; border-left: 1px solid var(--line); background: var(--panel); padding: 30px 24px; min-width: 0; }
    main.detail-open .detail { display: block; }
    .top {
      position: relative;
      min-height: 220px;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(300px, .78fr) minmax(440px, 1.22fr);
      align-items: stretch;
      margin-bottom: 22px;
      box-shadow: var(--shadow-lg);
    }
    .top:after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.15), rgba(255,255,255,0) 34%),
        linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(0,0,0,.1) 100%);
    }
    .hero-title {
      position: relative;
      z-index: 1;
      padding: 34px 34px;
      display: flex;
      align-items: center;
    }
    .hero-title h1 {
      color: white;
      max-width: 330px;
      text-shadow: none;
      font-size: 27px;
      line-height: 1.1;
      font-weight: 650;
    }
    .hero-title:before {
      content: "";
      position: absolute;
      left: 34px;
      top: 52px;
      width: 72px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,.3);
    }
    .hero-eyebrow {
      width: max-content;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px 9px 9px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      color: rgba(255,255,255,.95);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    }
    .hero-eyebrow span {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: white;
      color: var(--color-primary);
      font-size: 12px;
      font-weight: 850;
    }
    .hero-copy {
      margin: -12px 0 0;
      max-width: 300px;
      color: rgba(255,255,255,.85);
      font-size: 15px;
      line-height: 1.5;
    }
    .hero-execution {
      max-width: 300px;
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.85);
    }
    .hero-execution label {
      color: rgba(255,255,255,.85);
      font-size: 11px;
      font-weight: 800;
    }
    .hero-execution select {
      height: 42px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px;
      padding: 0 12px;
      background: rgba(255,255,255,.15);
      color: white;
      font-size: 14px;
      font-weight: 800;
      transition: all .2s ease;
    }
    .hero-execution select:focus { outline: none; background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.4); }
    .hero-execution option { color: var(--color-text-primary); }
    .hero-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .hero-action {
      min-height: 40px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      background: rgba(255,255,255,.1);
      color: white;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: all .2s ease;
    }
    .hero-action:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.3); }
    .hero-action.primary {
      border-color: rgba(255,255,255,.3);
      background: white;
      color: var(--color-primary);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
    }
    .hero-action.primary:hover { box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
    .hero-execution small {
      color: rgba(255,255,255,.7);
      font-size: 12px;
      line-height: 1.45;
    }
    .hero-visual {
      position: relative;
      z-index: 1;
      background-color: var(--color-bg-secondary);
      clip-path: none;
      min-height: 0;
      margin: 18px 18px 18px 0;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
    }
    .hero-visual img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center 68%;
    }
    .hero-visual:after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(90deg, rgba(255,255,255,.15), rgba(255,255,255,0) 42%),
        linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
      pointer-events: none;
    }
    h1 { margin: 0; font-size: 27px; line-height: 1.1; font-weight: 650; color: var(--ink); }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(150px, .8fr) minmax(150px, .8fr) minmax(240px, 1.35fr) auto;
      gap: 14px;
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow-md);
    }
    .field {
      height: 54px;
      background: var(--panel);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 8px 13px;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .02);
      transition: all .2s ease;
    }
    .field:focus-within { border-color: var(--color-primary-light); box-shadow: 0 0 0 3px var(--color-primary-light); }
    .field label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 5px; font-weight: 750; }
    select, input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }
    .btn {
      min-height: 48px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      padding: 0 16px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all .2s ease;
    }
    .btn:hover { background: var(--color-bg-tertiary); border-color: var(--color-border-light); box-shadow: var(--shadow-md); }
    .btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, .3); }
    .btn.primary:hover { background: var(--color-primary-dark); box-shadow: 0 6px 16px rgba(37, 99, 235, .4); }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
    .metric {
      background: var(--panel);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 20px;
      min-height: 118px;
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      transition: all .3s ease;
    }
    .metric:hover { border-color: var(--color-border-light); box-shadow: var(--shadow-lg); }
    .micon { display: none; }
    .metric h3 { margin: 0; color: var(--muted); font-size: 12px; font-weight: 850; }
    .metric strong { display: block; margin-top: 7px; font-size: 30px; color: var(--ink); letter-spacing: 0; }
    .metric small { display: none; }
    .results-focus {
      margin: 0 0 18px;
    }
    .results-focus-grid {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
      gap: 16px;
      align-items: stretch;
    }
    .focus-card {
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow-md);
      padding: 16px;
      min-width: 0;
    }
    .focus-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .focus-card h2 {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.25;
    }
    .focus-card .focus-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.35;
    }
    .focus-pill {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--purple-soft);
      color: var(--purple);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }
    .focus-pill.live {
      background: var(--ok-soft);
      color: var(--ok);
    }
    .focus-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .focus-meta div {
      border: 1px solid #efe8f6;
      border-radius: 8px;
      background: #fcfafe;
      padding: 9px;
      min-width: 0;
    }
    .focus-meta span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }
    .focus-meta strong {
      display: block;
      margin-top: 3px;
      color: var(--ink);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .execution-timeline {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    .timeline-step {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 8px;
      border: 1px solid #f0eaf5;
      border-radius: 8px;
      background: #fdfbff;
    }
    .timeline-dot {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
    }
    .timeline-dot.done { background: var(--ok); }
    .timeline-dot.running { background: var(--purple); }
    .timeline-dot.waiting { background: #a8a2b1; }
    .timeline-dot.error { background: var(--ko); }
    .timeline-step strong {
      display: block;
      color: #26133d;
      font-size: 12px;
      line-height: 1.25;
    }
    .timeline-step span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
    }
    .live-card-frame {
      min-height: 214px;
      border: 1px solid #ece6f3;
      border-radius: 8px;
      background: #f7f4fb;
      overflow: hidden;
      display: grid;
    }
    .live-card-frame iframe {
      width: 100%;
      height: 100%;
      min-height: 214px;
      border: 0;
      background: #fff;
    }
    .live-card-empty {
      min-height: 214px;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
    }
    .live-card-loader {
      display: grid;
      place-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .live-card-dots {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
    }
    .live-card-dots span {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--color-primary);
      animation: liveDotPulse 1.1s infinite ease-in-out;
    }
    .live-card-dots span:nth-child(2) { animation-delay: .16s; }
    .live-card-dots span:nth-child(3) { animation-delay: .32s; }
    @keyframes liveDotPulse {
      0%, 80%, 100% { opacity: .32; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-4px); }
    }
    .live-card-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .live-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .live-card-icon-actions {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    .live-card-icon-actions button {
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--color-primary);
      font-size: 15px;
      font-weight: 950;
      cursor: pointer;
      display: grid;
      place-items: center;
      line-height: 1;
    }
    .live-card-icon-actions button:hover {
      background: var(--color-primary-light);
      border-color: var(--color-primary);
    }
    .live-card-minimized .live-card-frame,
    .live-card-minimized .live-card-footer {
      display: none;
    }
    .live-card-actions button,
    .distribution-report {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .distribution-card {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(260px, .55fr);
      gap: 18px;
      align-items: center;
    }
    .pie-visual {
      width: 100%;
      min-height: 300px;
      display: grid;
      place-items: center;
      border: 1px solid #f0eaf5;
      border-radius: 10px;
      background: linear-gradient(180deg, #fff, #fcfafe);
      overflow: hidden;
    }
    .qa-pie-svg {
      width: min(100%, 440px);
      height: auto;
      display: block;
    }
    .pie-base-shadow {
      fill: rgba(76, 65, 92, .16);
    }
    .pie-slice-side {
      opacity: .92;
      filter: saturate(.86);
    }
    .pie-slice-top {
      stroke: rgba(255,255,255,.82);
      stroke-width: 1.5;
    }
    .pie-center-label {
      fill: #241B3A;
      font-size: 16px;
      font-weight: 950;
      text-anchor: middle;
    }
    .distribution-summary {
      min-height: 300px;
      display: grid;
      align-content: center;
      gap: 12px;
      padding: 18px;
      border: 1px solid #f0eaf5;
      border-radius: 10px;
      background: #fff;
    }
    .distribution-summary h3 {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.2;
    }
    .distribution-status-row {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
    }
    .distribution-status-row strong {
      color: var(--ink);
      font-size: 15px;
      font-weight: 950;
    }
    .distribution-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
    .distribution-status-dot.success { background: #007f5f; }
    .distribution-status-dot.failed { background: #dc001b; }
    .distribution-status-dot.other { background: #b8c5cc; }
    .distribution-status-dot.blocked { background: #ffc400; }
    .distribution-status-dot.running { background: #0077a3; }
    .metric-run {
      position: relative;
      min-width: 104px;
      min-height: 42px;
      border-radius: 8px;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: 12px;
      font-weight: 900;
      transition: all .2s ease;
      cursor: pointer;
    }
    .metric-run:before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 5px;
      height: 38%;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      pointer-events: none;
    }
    .metric-run:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, .25);
    }
    .metric-run.btn.primary {
      border: 1px solid var(--color-primary-dark);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, .3);
    }
    .metric-run:not(.primary) {
      border-color: var(--color-border);
      background: var(--panel);
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      margin-bottom: 18px;
      overflow: hidden;
      transition: all .3s ease;
    }
    .panel:hover { border-color: var(--color-border-light); box-shadow: var(--shadow-lg); }

      window.location.replace('http://127.0.0.1:4173/newform.html');
    }

    let campaign = null;
    let selectedId = '';
    let currentJobId = '';
    let currentRunMode = '';
    let currentViewMode = 'full';
    const ENVIRONMENT_STORAGE_KEY = 'qa-newform-current-environment';
    function readStoredEnvironment() {
      try {
        return normalizeEnv(localStorage.getItem(ENVIRONMENT_STORAGE_KEY) || 'REC');
      } catch {
        return 'REC';
      }
    }
    function persistEnvironment(environment) {
      try {
        localStorage.setItem(ENVIRONMENT_STORAGE_KEY, normalizeEnv(environment || 'REC'));
      } catch {
        // ignore storage errors
      }
    }
    let currentEnvironment = readStoredEnvironment();
    let executionResultOverrides = {};

    function normalizeDisplayValue(value) {
      let text = String(value ?? '');
      if (/[\u00c2\u00c3\u00e2]/.test(text)) {
        try {
          const decoded = decodeURIComponent(escape(text));
          if (decoded && !decoded.includes('\uFFFD')) text = decoded;
        } catch {
          // Le texte reste affiche tel quel si la correction d'encodage n'est pas applicable.
        }
      }
      return text;
    }
    const esc = (value) => normalizeDisplayValue(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const localServerBase = window.location.protocol === 'file:' ? 'http://127.0.0.1:4173' : '';
    const localUrl = (value) => {
      const url = String(value || '');
      if (!url || /^(https?:|data:|\.\/|\.\.\/)/i.test(url)) return url;
      return url.startsWith('/') ? `${localServerBase}${url}` : url;
    };

    function apiUrl(path) {
      const value = String(path || '');
      if (/^https?:\/\//i.test(value)) return value;
      return `${localServerBase}${value.startsWith('/') ? value : `/${value}`}`;
    }

    function normalizeTextValue(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')

    function normalizeEnv(value) {
      const text = String(value || '').toUpperCase();
      if (text.includes('DEV')) return 'DEV';
      if (text.includes('INT')) return 'INT';
      if (text.includes('PRE')) return 'PREPROD';
      return 'REC';

    function campaignIdFromEnvironment(environment) {
      const env = normalizeEnv(environment);
      if (env === 'INT') return 'tnr-front-integration';

    }

    function filteredTests() {
      const status = document.getElementById('statusFilter').value;

      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      return tests().filter((test) => {
        if (status && test.status !== status) return false;
        if (app === 'newform' && test.status === 'pending') return false;
        if (app === 'parcours' && !test.eudonetStatus) return false;
        if (app === 'nonexecuted' && test.status !== 'pending') return false;
        if (app === 'eudonet' && !test.eudonetStatus) return false;
        if (search && !`${test.school} ${test.schoolSlug}`.toLowerCase().includes(search)) return false;
        return true;

    function newformStep(test) {
      if (test.status === 'running') return { label: 'En cours', className: 'pending' };
      if (test.status === 'passed') return { label: 'OK', className: 'ok' };
      if (test.status === 'failed') return { label: 'KO', className: 'ko' };

      return { label: 'Non exécuté', className: 'pending' };

    function eudonetStep(test) {
      if (test.eudonetStatus) {
        return { label: statusLabel[test.eudonetStatus] || String(test.eudonetStatus), className: statusClass[test.eudonetStatus] || 'pending' };
      }
      return { label: 'Non exécuté', className: 'pending' };

    function parcoursResult(test) {

      if (test.status === 'blocked') return { label: 'Bloqué NewForm', className: 'blocked' };
      if (test.status === 'failed') return { label: 'Échec NewForm', className: 'ko' };
      if (test.status === 'passed' && test.eudonetStatus === 'passed') return { label: 'Succès', className: 'ok' };
      if (test.status === 'passed' && test.eudonetStatus === 'failed') return { label: 'Échec Eudonet', className: 'ko' };
      if (test.status === 'passed' && test.eudonetStatus === 'blocked') return { label: 'Bloqué Eudonet', className: 'blocked' };
      if (test.status === 'passed') return { label: 'OK NewForm', className: 'ok' };

    function isJobRunning(job) {
      const status = String(job?.status || '').toLowerCase();
      return status === 'running' || status === 'queued' || status === 'en cours';
    }

    function distributionStats(rows) {
      const total = rows.length;
      const success = rows.filter((test) => test.status === 'passed').length;
      const failed = rows.filter((test) => test.status === 'failed').length;
      const blocked = rows.filter((test) => test.status === 'blocked').length;
      const running = rows.filter((test) => test.status === 'running').length;
      const other = Math.max(0, total - success - failed - blocked - running);
      return { total, success, failed, blocked, running, other };
    }

    function pct(count, total) {
      if (!total) return '0%';
      return `${Math.round((count / total) * 100)}%`;
    }

    function piePoint(cx, cy, rx, ry, angleDeg) {
      const angle = (angleDeg - 90) * Math.PI / 180;
      return {
        x: cx + rx * Math.cos(angle),
        y: cy + ry * Math.sin(angle),
      };
    }

    function pieSlicePath(cx, cy, rx, ry, startAngle, endAngle) {
      const start = piePoint(cx, cy, rx, ry, startAngle);
      const end = piePoint(cx, cy, rx, ry, endAngle);
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;
      return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${rx} ${ry} 0 ${largeArc} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
    }

    function renderPieChart(stats) {
      const total = Math.max(0, stats.total);
      const cx = 210;
      const cy = 132;
      const rx = 136;
      const ry = 78;
      const rows = [
        { key: 'success', count: stats.success, color: '#007f5f', side: '#005f48' },
        { key: 'failed', count: stats.failed, color: '#dc001b', side: '#a90016' },
        { key: 'other', count: stats.other, color: '#b8c5cc', side: '#8799a2' },
        { key: 'blocked', count: stats.blocked, color: '#ffc400', side: '#b88900' },
        { key: 'running', count: stats.running, color: '#0077a3', side: '#005677' },
      ];
      const activeRows = total ? rows.filter((row) => row.count > 0) : [];
      let angle = 0;
      const slices = activeRows.map((row) => {
        const span = (row.count / total) * 360;
        const start = angle;
        const end = angle + span;
        angle = end;
        return {
          ...row,
          start,
          end: Math.min(end, 359.999),
          mid: start + span / 2,
        };
      });
      const sidePaths = slices.map((slice) => `<path class="pie-slice-side" d="${pieSlicePath(cx, cy + 24, rx, ry, slice.start, slice.end)}" fill="${esc(slice.side)}"></path>`).join('');
      const topPaths = slices.map((slice) => `<path class="pie-slice-top" d="${pieSlicePath(cx, cy, rx, ry, slice.start, slice.end)}" fill="${esc(slice.color)}"></path>`).join('');
      const emptyPie = total ? '' : `
        <ellipse cx="${cx}" cy="${cy + 24}" rx="${rx}" ry="${ry}" fill="#d7d2dc"></ellipse>
        <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#ece8f1" stroke="rgba(255,255,255,.82)" stroke-width="1.5"></ellipse>`;
      return `
        <div class="pie-visual">
          <svg class="qa-pie-svg" viewBox="0 0 420 290" role="img" aria-label="Répartition des résultats">
            <ellipse class="pie-base-shadow" cx="${cx}" cy="${cy + 42}" rx="154" ry="82"></ellipse>
            ${sidePaths || emptyPie}
            ${topPaths}
          </svg>
        </div>`;
    }

    function renderDistributionSummary(stats) {
      const rows = [
        { key: 'success', label: 'Succès', count: stats.success },
        { key: 'failed', label: 'Échec', count: stats.failed },

        { key: 'blocked', label: 'Bloqué', count: stats.blocked },

      return `
        <div class="distribution-summary">
          ${rows.map((row) => `
            <div class="distribution-status-row">
              <span class="distribution-status-dot ${esc(row.key)}"></span>

    function runningJobSchool(job) {
      return job?.currentSchoolLabel || job?.school || job?.schoolLabel || job?.currentSchoolSlug || job?.schoolSlug || (Array.isArray(job?.schoolSlugs) && job.schoolSlugs.length === 1 ? job.schoolSlugs[0] : 'Toutes les écoles');
    }

    function runningJobEnvironment(job) {
      return normalizeEnv(job?.environmentCode || job?.environment || environmentFromCampaignId(job?.campaignId || selectedCampaignId()));

    function currentTimelineIndex(job) {
      const logs = Array.isArray(job?.logLines) ? job.logLines.slice(-8).join(' ') : '';
      const text = `${job?.currentStep || ''} ${job?.currentSchoolLabel || ''} ${logs}`.toLowerCase();
      const journey = isJourneyJob(job);
      if (/cloture|paiement/.test(text)) return 4;
      if (/verification|recap/.test(text)) return journey ? 4 : 3;
      if (/eudonet|crm|controle/.test(text)) return journey ? 3 : 3;
      if (/upload|piece|document|page 2/.test(text)) return 2;
      if (/candidat|information|page 1|formulaire/.test(text)) return 1;
      return job?.completedSchools ? (journey ? 4 : 3) : 0;

    function timelineStepsForJob(job) {
      if (isJourneyJob(job)) {
        return [

          'Remplissage des informations candidat',
          'Upload des pièces justificatives',
          'Contrôle dans Eudonet',
          'Vérification et clôture',

      return [
        'Ouverture du formulaire NewForm',
        'Remplissage des informations candidat',
        'Upload des pièces justificatives',
        'Vérification NewForm',
        'Clôture NewForm',
      ];

    function renderTimeline(job) {
      const steps = timelineStepsForJob(job);
      const current = currentTimelineIndex(job);
      const hasError = String(job?.status || '').toLowerCase().includes('fail') || Boolean(job?.error || job?.errorMessage);
      return `<div class="execution-timeline">${steps.map((label, index) => {
        const state = hasError && index === current ? 'error' : index < current ? 'done' : index === current ? 'running' : 'waiting';
        const text = state === 'done' ? 'Terminé' : state === 'running' ? 'En cours' : state === 'error' ? 'Erreur' : 'En attente';
        const marker = state === 'done' ? 'OK' : String(index + 1);
        return `
          <div class="timeline-step">
            <span class="timeline-dot ${state}">${esc(marker)}</span>
            <span><strong>${esc(label)}</strong><span>${esc(text)}</span></span>

      }).join('')}</div>`;

            activeDetailTab = 'historique';
            document.querySelector('main').classList.add('detail-open');
            closeActionMenu();
            renderAll(false);
          } else if (action === 'relaunch') {
            closeActionMenu();
            runRowTest(id);
          }
        });
      }
      const opening = !(menu.classList.contains('open') && menu.dataset.testId === testId);
      closeActionMenu();
      if (!opening) return;
      menu.dataset.testId = testId;
      menu.classList.add('open');
      const buttonRect = button.getBoundingClientRect();
      const menuRect = menu.getBoundingClientRect();
      const left = Math.max(12, Math.min(window.innerWidth - menuRect.width - 12, buttonRect.right - menuRect.width));
      const topBelow = buttonRect.bottom + 8;
      const topAbove = buttonRect.top - menuRect.height - 8;
      const top = topBelow + menuRect.height > window.innerHeight - 12 ? Math.max(12, topAbove) : topBelow;
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
      button.classList.add('active');
      button.setAttribute('aria-expanded', 'true');
    }

    function selectedScenarioSchool() {
      const selected = tests().find((test) => test.id === selectedId) || tests()[0] || null;
      return selected?.schoolSlug || '';

    function normalizeText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function detectSchoolFromScenarioText(text) {
      const normalized = normalizeText(text);
      if (!normalized) return null;
      const aliases = [
        ['mastersinseec', ['inseec msc', 'msc inseec', 'masters inseec', 'formulaire msc', 'ecole msc']],
        ['bachelorsinseec', ['inseec bachelor', 'bachelor inseec', 'formulaire bachelor']],
        ['supdepub', ['sup de pub', 'supdepub']],
        ['supdecreation', ['sup de crea', 'sup de creation', 'supdecreation']],
        ['inseecbba', ['inseec bba', 'bba inseec']],
        ['international', ['international']],
        ['ium', ['ium', 'monaco']],
        ['ece', ['ece']],
        ['heip', ['heip']],
        ['isbe', ['inseec grande ecole', 'grande ecole']],
        ['inseecbts', ['inseec bts', 'bts']],
      ];
      const match = aliases.find(([, names]) => names.some((name) => normalized.includes(normalizeText(name))));
      if (!match) return null;
      return tests().find((test) => test.schoolSlug === match[0]) || null;
    }

    async function loadSquashScenariosForModal(environment = '', { live = false, refresh = false, force = false } = {}) {
      const env = normalizeEnv(environment || document.getElementById('scenarioEnv')?.value || document.getElementById('railEudonetEnv')?.value || document.getElementById('heroRunEnv')?.value || 'REC');
      const cacheKey = `${env}::${live ? 'live' : 'cache'}`;
      if (!force && squashCatalogLoadedFor === cacheKey && squashCampaignOptions.length) return;
      squashCatalogLoadedFor = cacheKey;
      squashModalLoading = live;
      squashModalMessage = live
        ? 'Actualisation Squash en cours : récupération des lots, campagnes et scénarios NewForm.'
        : squashModalMessage;
      squashScenarioOptions = [];
      squashCampaignOptions = [];
      try {
        const url = live
          ? `/api/squash-catalog?live=1&all=1&refresh=${refresh ? '1' : '0'}&project=${encodeURIComponent('NewForm')}&environment=${encodeURIComponent(env)}`
          : `/api/squash-catalog?project=${encodeURIComponent('NewForm')}&environment=${encodeURIComponent(env)}`;
        const payload = await fetchJsonWithLocalFallback(url);
        const projects = Array.isArray(payload.projects) ? payload.projects : [];
        const newformProjects = projects.filter((item) => /newform|formulaire|fdc/i.test(`${item.name || ''} ${item.application || ''}`));
        const project = newformProjects.find((item) => Array.isArray(item.campaigns) && item.campaigns.length)
          || projects.find((item) => Array.isArray(item.campaigns) && item.campaigns.length)
          || newformProjects[0]
          || projects[0];
        squashCampaignOptions = (Array.isArray(project?.campaigns) ? project.campaigns : []).map((campaignItem) => ({
          id: campaignItem.id || campaignItem.name,
          name: campaignItem.name || campaignItem.id || '',
          project: project.name || project.application || 'NewForm',
          environment: campaignItem.environment || env,
          lot: campaignItem.lot || campaignItem.lotId || 'Sans lot',
          lotId: campaignItem.lotId || campaignItem.lot || 'Sans lot',
          scenarios: Array.isArray(campaignItem.scenarios) ? campaignItem.scenarios : [],
        }));
        const options = [];
        for (const campaignItem of squashCampaignOptions) {
          for (const scenario of campaignItem.scenarios) {
            const id = `${campaignItem.id || campaignItem.name}::${scenario.id || scenario.name}`;
            options.push({
              id,
              project: campaignItem.project,
              name: scenario.name || scenario.id || 'Scénario Squash',
              label: `${campaignItem.lot || campaignItem.lotId || 'Sans lot'} / ${campaignItem.name || campaignItem.id || 'Campagne'} / ${scenario.name || scenario.id || 'Scénario Squash'}`,
              scenarioId: scenario.id || scenario.name || '',
              campaign: campaignItem.name || campaignItem.id || '',
              environment: campaignItem.environment || env,
              lot: campaignItem.lot || '',
              lotId: campaignItem.lotId || '',
            });
          }
        }
        squashScenarioOptions = options.slice(0, 80);
        const lotCount = scenarioSquashLots().length;
        squashModalMessage = lotCount
          ? `Squash branché : ${lotCount} lot(s) / dossier(s), ${squashCampaignOptions.length} campagne(s), ${squashScenarioOptions.length} scénario(s) récupéré(s).`
          : 'Aucun lot Squash NewForm trouvé pour cet environnement. Lance une actualisation Squash si le cache est vide.';
        if (payload?.warning) squashModalMessage = `${squashModalMessage} ${payload.warning}`;
      } catch (error) {
        squashScenarioOptions = [];
        squashCampaignOptions = [];
        squashModalMessage = `Lecture Squash impossible : ${error.message || error}`;
      } finally {
        squashModalLoading = false;
      }
    }

    function scenarioSquashProjects() {
      return ['NewForm'];
    }

    function scenarioSquashLots() {
      const lots = new Map();
      squashCampaignOptions.forEach((campaignItem) => {
        const lot = campaignItem.lot || campaignItem.lotId || 'Sans lot';
        lots.set(lot, lot);
      });
      return Array.from(lots.keys());
    }

    function scenarioSquashCampaigns(lot) {
      return squashCampaignOptions.filter((campaignItem) => {
        const campaignLot = campaignItem.lot || campaignItem.lotId || 'Sans lot';
        return lot && campaignLot === lot;
      });
    }

    function scenarioSquashCampaignById(campaignId) {
      return squashCampaignOptions.find((campaignItem) => campaignItem.id === campaignId || campaignItem.name === campaignId) || null;
    }

    function scenarioSquashScenarios(campaignId) {
      const campaignItem = scenarioSquashCampaignById(campaignId);
      return Array.isArray(campaignItem?.scenarios) ? campaignItem.scenarios : [];
    }

    function scenarioSquashOptionBySelection(campaignId, scenarioId) {
      const campaignItem = scenarioSquashCampaignById(campaignId);
      if (!campaignItem) return null;
      const scenario = scenarioId
        ? (campaignItem.scenarios || []).find((item) => item.id === scenarioId || item.name === scenarioId)
        : null;

      return {
        id,
        project: 'NewForm',
        name: scenario?.name || '',
        scenarioId: scenario?.id || scenario?.name || '',
        campaign: campaignItem.name || campaignItem.id || '',
        campaignId: campaignItem.id || campaignItem.name || '',
        environment: campaignItem.environment || '',
        lot: campaignItem.lot || campaignItem.lotId || '',

    function liveExecutionTypeLabel(job = {}) {
      const source = job.scenarioConfig?.source || job.source || '';
      if (source === 'jira') return 'Jira';
      if (source === 'manual' || job.type === 'manual') return 'Scénario personnalisé';
      if (source === 'squash' || job.type === 'squash') return 'Squash';
      if (job.type === 'journey') return 'Parcours complet';
      if (job.mode === 'school') return 'Execution classique';
      if (job.mode === 'all' || job.mode === 'failed' || job.mode === 'blocked') return 'Campagne classique';
      return 'Execution classique';

    async function analyzeManualScenarioConfig(config) {
      const scenarioText = [
        config.manualScenario?.title,
        config.manualScenario?.description,
        config.manualScenario?.dataToUse,
        config.manualScenario?.comment,
        config.customScenario,
      ].filter(Boolean).join('\n\n');
      const response = await fetch(apiUrl('/api/manual-scenario-plan'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenarioText }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.success === false) throw new Error(payload.error || 'Impossible d analyser le scenario.');
      return payload.plan || null;
    }

    function renderUnderstoodPlan(plan) {
      if (!plan) {
        return `
          <div class="understood-plan">
            <div class="understood-plan-head">
              <strong>Plan compris par l'agent</strong>
            </div>
            <div class="subtitle">Renseigne le scenario puis lance l'analyse avant execution.</div>
            <div class="queue-actions"><button class="plan-action" id="analyzeManualPlanBtn" type="button">Analyser le scenario</button></div>
          </div>`;
      }
      const unsupported = Number(plan.stats?.unsupported || 0);
      return `
        <div class="understood-plan">
          <div class="understood-plan-head">
            <strong>Plan compris par l'agent</strong>
          </div>
          ${unsupported ? `<div class="plan-warning">${esc(plan.blockedReason || "L'agent a detecte une etape non supportee.")}</div>` : ''}
          ${(plan.steps || []).map((step) => `
            <div class="understood-step">
              <strong>${esc(step.order || '-')}</strong>
              <span>${esc(step.text || '-')}<small>${esc(step.action || step.actionLabel || step.actionId || '-')}</small></span>
              <span class="badge ${step.supported ? 'ok' : 'ko'}">${step.supported ? 'supportee' : 'non supportee'}</span>
            </div>
          `).join('') || '<div class="subtitle">Aucune etape comprise.</div>'}
          <div class="queue-actions"><button class="plan-action" id="analyzeManualPlanBtn" type="button">Reanalyser</button></div>
        </div>`;
    }

    function queueStatusLabel(status) {
      return status === 'ready' ? 'Pret a lancer'
        : status === 'queued' ? 'En attente'
          : status === 'running' ? 'En cours'
            : status === 'success' ? 'Succes'
              : status === 'failed' ? 'KO'
                : status === 'blocked' ? 'Bloque'
                  : status || '-';
    }

    function queueStatusClass(status) {
      if (status === 'success' || status === 'ready') return 'ok';
      if (status === 'failed' || status === 'blocked') return 'ko';
      return 'pending';
    }

    function manualBusinessStatusForConfig(config = {}) {
      const row = tests().find((test) => (
        test.schoolSlug === config.schoolSlug
        || normalizeTextValue(test.school || '') === normalizeTextValue(config.school || '')
      ));
      const status = String(row?.manualScenario?.status || '').toUpperCase();
      if (status === 'OK') return { status: 'success', reason: '' };
      if (status === 'KO') return { status: 'failed', reason: row?.manualScenario?.businessConclusion || 'Scénario terminé avec anomalie métier.' };
      if (status.includes('BLO')) return { status: 'blocked', reason: row?.manualScenario?.businessConclusion || 'Scénario bloqué.' };
      return null;
    }

    async function analyzeCurrentManualPlan() {
      const config = readScenarioConfigFromModal();
      if (config.source !== 'manual') return null;
      currentManualPlan = await analyzeManualScenarioConfig(config);
      lastScenarioConfig = { ...config, understoodPlan: currentManualPlan };
      return currentManualPlan;
    }

    async function addCurrentManualScenarioToQueue() {
      const config = readScenarioConfigFromModal();
      if (config.source !== 'manual') return;
      if (!config.customScenario && !config.manualScenario?.title) {
        throw new Error("Renseigne le scénario personnalisé avant de l'ajouter à la file.");
      }
      const plan = currentManualPlan || await analyzeManualScenarioConfig(config);
      const id = `manual-${Date.now()}-${manualScenarioQueue.length + 1}`;
      manualScenarioQueue.push({
        id,
        index: manualScenarioQueue.length + 1,
        config: { ...config, understoodPlan: plan },
        plan,
        status: plan.valid ? 'ready' : 'blocked',
        reason: plan.valid ? '' : plan.blockedReason,
        jobId: '',
      });
      currentManualPlan = null;
      lastScenarioConfig = {
        ...config,
        scenario: '',
        manualScenario: {
          title: '',
          description: '',
          scenarioText: '',
          dataToUse: '',
          comment: '',
        },
        customScenario: '',
        understoodPlan: null,
      };
      scenarioModalMessage = plan.valid
        ? 'Scénario ajouté à la file. Tu peux renseigner le scénario suivant.'
        : 'Scénario ajouté à la file, mais bloqué car une étape est non supportée. Tu peux renseigner le scénario suivant.';
      scenarioModalMessageType = plan.valid ? 'success' : 'error';
      renderScenarioModal();
    }

    async function runQueuedManualScenario(item) {
      if (!item?.plan?.valid || manualQueueRunning) return;
      currentEnvironment = normalizeEnv(item.config?.environment || currentEnvironment || 'REC');
      manualQueueRunning = true;
      item.status = 'running';
      item.reason = '';
      renderScenarioModal();
      try {
        const job = await startManualScenarioJob(item.config);
        item.jobId = job.id || '';
        currentQaJobId = job.id || '';
        updateLiveBrowser(job, { forceOpen: true });
        renderLiveExecution(job);
        while (item.jobId) {
          const polled = await fetch(apiUrl(`/api/qa-jobs/${item.jobId}`), { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
          if (!polled) break;
          currentQaJobId = item.jobId;
          renderLiveExecution(polled);
          if (!['queued', 'running'].includes(polled.status)) {
            await loadCampaign(true);
            const businessStatus = manualBusinessStatusForConfig(item.config);
            item.status = businessStatus?.status || (polled.status === 'completed' ? 'success' : 'failed');
            item.reason = businessStatus?.reason || (polled.status === 'completed' ? '' : (polled.errorMessage || 'Exécution terminée avec anomalie.'));
            break;
          }
          await new Promise((resolve) => setTimeout(resolve, 2200));
        }
      } catch (error) {
        item.status = 'failed';
        item.reason = error.message || 'Exécution impossible.';
      } finally {
        manualQueueRunning = false;
        currentQaJobId = '';
        renderScenarioModal();
        loadCampaign(true);
      }
    }

    async function runAllValidManualScenarios() {
      if (manualQueueRunning) return;
      const items = manualScenarioQueue.filter((item) => item.plan?.valid && ['ready', 'queued', 'failed'].includes(item.status));
      for (const item of items) {
        await runQueuedManualScenario(item);
      }
    }
