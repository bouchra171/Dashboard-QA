    function readScenarioConfigFromModal() {
      const source = document.getElementById('scenarioSource')?.value || scenarioSource || 'squash';
      let schoolSlug = document.getElementById('scenarioSchool')?.value || selectedScenarioSchool();
      let school = tests().find((test) => test.schoolSlug === schoolSlug);
      const selectedJiraKey = document.getElementById('scenarioJiraTicket')?.value || '';
      const jiraIssue = jiraScenarioIssues.find((issue) => issue.key === selectedJiraKey) || null;
      const squashLot = document.getElementById('scenarioSquashLot')?.value || '';
      const squashCampaign = document.getElementById('scenarioSquashCampaign')?.value || '';
      const squashId = document.getElementById('scenarioSquash')?.value || '';
      const selectedSquashCampaign = scenarioSquashCampaignById(squashCampaign);
      const squashScenario = scenarioSquashOptionBySelection(squashCampaign, squashId);
      const manualTitle = document.getElementById('manualTitle')?.value.trim() || '';
      const manualDescription = document.getElementById('manualDescription')?.value.trim() || '';
      const manualText = manualDescription;
      const inferredManualTitle = manualTitle || manualText.split(/\r?\n/).map((line) => line.trim()).find(Boolean)?.slice(0, 90) || '';
      const manualScenario = {
        title: inferredManualTitle,
        description: manualDescription,
        scenarioText: manualText,
        dataToUse: '',
        comment: '',
      };
      if (source === 'manual') {
        const detectedSchool = detectSchoolFromScenarioText(`${manualTitle}\n${manualText}`);
        if (detectedSchool) {
          school = detectedSchool;
          schoolSlug = detectedSchool.schoolSlug || schoolSlug;
          if (document.getElementById('scenarioSchool') && document.getElementById('scenarioSchool').value !== schoolSlug) {
            document.getElementById('scenarioSchool').value = schoolSlug;
          }
        }
      }
      const config = {
        environment: document.getElementById('scenarioEnv')?.value || 'REC',
        school: school?.school || schoolSlug || '-',
        schoolSlug,
        source,
        options: {
          captureProof: Boolean(document.getElementById('scenarioCaptureProof')?.checked),
          generateReport: Boolean(document.getElementById('scenarioGenerateReport')?.checked),
          updateResultsTable: Boolean(document.getElementById('scenarioUpdateResults')?.checked),
          detectPointsToTreat: Boolean(document.getElementById('scenarioDetectPoints')?.checked),
        },
      };
      if (source === 'jira') {
        config.scenario = jiraIssue ? `${jiraIssue.key} - ${jiraIssue.title}` : 'Ticket Jira';
        config.jira = {
          project: jiraScenarioProject || 'NewForm',
          ticketKey: jiraIssue?.key || selectedJiraKey,
          ticketTitle: jiraIssue?.title || '',
          ticketUrl: jiraIssue?.url || '',
          priority: jiraIssue?.priority || '',
          status: jiraIssue?.status || '',
        };
      } else if (source === 'squash') {
        config.scenario = squashScenario?.name || selectedSquashCampaign?.name || 'Campagne Squash';
        config.squashScenario = squashScenario;
        config.squash = {
          project: 'NewForm',
          lot: squashLot || selectedSquashCampaign?.lot || '',
          campaign: selectedSquashCampaign?.name || squashCampaign || '',
          campaignId: selectedSquashCampaign?.id || squashCampaign || '',
          scenario: squashScenario?.name || '',
          scenarioId: squashScenario?.scenarioId || '',
        };
      } else {
        config.scenario = manualScenario.title || 'Scénario personnalisé';
        config.manualScenario = manualScenario;
        config.customScenario = manualScenario.description || '';
        if (currentManualPlan) config.understoodPlan = currentManualPlan;
      }
      return config;
    }

    async function launchConfiguredScenario() {
      if (isScenarioExecutionRunning()) return;
      const config = readScenarioConfigFromModal();
      currentEnvironment = normalizeEnv(config.environment || currentEnvironment || 'REC');
      if (config.source === 'jira' && !config.jira?.ticketKey) {
        showRunMessage('Selectionne un ticket Jira avant de lancer.', 'error');
        return;
      }
      if (config.source === 'squash' && !config.squash?.campaign) {
        showRunMessage('Selectionne un lot et une campagne Squash avant de lancer.', 'error');
        return;
      }
      if (config.source === 'manual' && !config.manualScenario?.title && !config.manualScenario?.description) {
        showRunMessage('Decris le scenario a executer avant de lancer.', 'error');
        return;
      }
      if (config.source === 'manual') {
        try {
          const plan = currentManualPlan || await analyzeManualScenarioConfig(config);
          currentManualPlan = plan;
          config.understoodPlan = plan;
          if (!plan.valid) {
            scenarioModalMessage = plan.blockedReason || "L'agent a detecte une etape non supportee.";
            scenarioModalMessageType = 'error';
            showRunMessage(scenarioModalMessage, 'error');
            renderScenarioModal();
            return;
          }
        } catch (error) {
          scenarioModalMessage = error.message || 'Analyse du scenario impossible.';
          scenarioModalMessageType = 'error';
          showRunMessage(scenarioModalMessage, 'error');
          renderScenarioModal();
          return;
        }
      }
      lastScenarioConfig = config;
      scenarioRunStatus = 'En cours';
      scenarioModalMessage = 'Preparation de l execution du scenario...';
      scenarioModalMessageType = '';
      selectedId = tests().find((test) => test.schoolSlug === config.schoolSlug)?.id || selectedId;
      showRunMessage(`Lancement du scenario personnalise interprete "${config.scenario}" pour ${config.school}.`);
      renderScenarioLauncher();
      renderScenarioModal();

      if (config.source === 'squash') {
        await runSquashScenarioFromModal(config);
      } else if (config.source === 'manual') {
        await runManualScenarioFromModal(config);
      } else {
        await runCustomAgentScenario(config);
      }
    }

    function customScenarioNeedsEudonet(config) {
      const text = `${config.scenario || ''} ${config.customScenario || ''}`.toLowerCase();
      return /eudonet|crm|candidat.*retrouv|controle/.test(text);
    }

    async function runCustomAgentScenario(config) {
      const campaignId = campaignIdFromEnvironment(config.environment);
      if (customScenarioNeedsEudonet(config)) {
        await runJourney('school', config.schoolSlug, campaignId, config);
      } else {
        await runCampaign('school', config.schoolSlug, campaignId, config);
      }
    }

    async function startManualScenarioJob(config) {
      const response = await fetch(apiUrl('/api/manual-scenario-execution'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenarioConfig: config }),
      });
      const job = await response.json().catch(() => ({}));
      if (response.status === 404) {
        throw new Error('Endpoint scénario personnalisé introuvable. Redémarre le serveur Node pour charger la nouvelle logique.');
      }
      if (!response.ok) {
        if (job.understoodPlan) currentManualPlan = job.understoodPlan;
        throw new Error(job.error || 'Impossible de lancer le scénario personnalisé.');
      }
      return job;
    }

    async function runManualScenarioFromModal(config) {
      try {
        const job = await startManualScenarioJob(config);
        currentQaJobId = job.id;
        scenarioRunStatus = 'En cours';
        scenarioModalMessage = `Exécution lancée : ${config.scenario}.`;
        scenarioModalMessageType = 'success';
        showRunMessage(`Scénario personnalisé interprété lancé : ${config.scenario}.`);
        updateLiveBrowser(job, { forceOpen: true });
        renderLiveExecution(job);
        renderScenarioLauncher();
        pollQaJob();
      } catch (error) {
        scenarioRunStatus = 'KO';
        scenarioModalMessage = error.message || 'Impossible de lancer le scénario personnalisé.';
        scenarioModalMessageType = 'error';
        showRunMessage(error.message || 'Impossible de lancer le scénario personnalisé.', 'error');
        renderScenarioLauncher();
      }
    }

    async function runSquashScenarioFromModal(config) {
      const squash = config.squash || {};
      if (!squash.campaign) {
        showRunMessage('Sélection Squash incomplète : choisis un lot et une campagne.', 'error');
        scenarioRunStatus = 'Bloqué';
        renderScenarioLauncher();
        return;
      }
      try {
        const response = await fetch(apiUrl('/api/squash-execution'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            project: squash.project || 'NewForm',
            environment: config.environment,
            campaign: squash.campaign,
            scenario: squash.scenarioId || '',
            lot: squash.lot,
            lotId: squash.lotId,
            scenarioConfig: config,
          }),
        });
        const job = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(job.error || 'Impossible de lancer le scénario Squash.');
        currentQaJobId = job.id;
        scenarioRunStatus = 'En cours';
        scenarioModalMessage = `Exécution Squash lancée : ${config.scenario}.`;
        scenarioModalMessageType = 'success';
        showRunMessage(`Scénario Squash lancé : ${config.scenario}.`);
        renderLiveExecution(job);
        renderScenarioLauncher();
        pollQaJob();
      } catch (error) {
        scenarioRunStatus = 'KO';
        scenarioModalMessage = error.message || 'Impossible de lancer le scénario Squash.';
        scenarioModalMessageType = 'error';
        showRunMessage(error.message || 'Impossible de lancer le scénario Squash.', 'error');
        renderScenarioLauncher();
      }
    }

    function anomalyKey(anomaly) {
      return [
        anomaly.schoolName,
        anomaly.environment,
        anomaly.module,
        anomaly.anomalyType,
        anomaly.errorMessage,
        anomaly.scenario,
      ]
        .map((value) => String(value || '').trim().toLowerCase())
        .join('|');
    }

    function detectedAnomalies() {
      const rows = filteredTests();
      const anomalies = [];
      for (const test of rows) {
        const result = parcoursResult(test);
        if (result.label === 'Succès') continue;
        const environment = campaign?.environment || test.environment || 'REC';
        const base = {
          testId: test.id,
          schoolName: test.school || test.schoolSlug || '-',
          environment,
          newformStatus: newformStep(test).label,
          eudonetStatus: eudonetStep(test).label,
          resultStatus: result.label,
          executionDate: test.executedAtHuman || test.executedAt || '',
          reportUrl: test.reportUrl || test.reportPath || '',
          proofUrl: test.proofUrl || '',
          jddUrl: test.jddUrl || test.jddPath || '',
          errorMessage: test.suspectedCause || test.summary || test.journeyMessage || test.error || '',
          scenario: test.scenario || test.scenarioName || campaign?.title || '',
        };
        if (test.status === 'failed') {
          anomalies.push({ ...base, module: 'NewForm', anomalyType: 'Echec NewForm' });
          continue;
        }
        if (test.status === 'blocked') {
          anomalies.push({ ...base, module: 'NewForm', anomalyType: 'Blocage NewForm' });
          continue;
        }
        if (test.status === 'passed' && test.eudonetStatus === 'failed') {
          anomalies.push({ ...base, module: 'Eudonet', anomalyType: 'Echec Eudonet' });
        }
      }
      return anomalies;
    }

    function anomalyCriticality(anomaly) {
      if (/blocage/i.test(anomaly.anomalyType || '')) return 'Bloquant';
      if (/echec/i.test(anomaly.anomalyType || '')) return 'Majeur';
      return 'Mineur';
    }

    function criticalityBadgeClass(value) {
      if (value === 'Bloquant') return 'blocked';
      if (value === 'Majeur') return 'ko';
      return 'pending';
    }

    function jiraBusinessStatus(state) {
      const category = String(state?.jiraStatusCategory || '').toLowerCase();
      const status = String(state?.jiraStatus || '').trim();
      if (!state) return 'À créer';
      if (state.status === 'loading') return 'Création...';
      if (state.status === 'error') return 'Erreur Jira';
      if (category === 'done' || /resolu|done|clos|termine/i.test(status)) return 'Résolu';
      return status || 'Ouvert';
    }

    function jiraStatusHtml(anomaly) {
      const state = jiraState[anomalyKey(anomaly)];
      if (!state) return '<span class="badge pending">À créer</span>';
      if (state.status === 'loading') return '<span class="badge pending">Création...</span>';
      if (state.status === 'error') return '<span class="badge ko">Erreur Jira</span>';
      if (state.alreadyExists) {
        return `<a class="jira-link existing-ticket" href="${esc(state.jiraUrl || '#')}" target="_blank" rel="noopener"><span class="badge">Existant</span> Ticket déjà créé pour le même bug : ${esc(state.jiraKey || '-')}</a>`;
      }
      const businessStatus = jiraBusinessStatus(state);
      const badgeClass = businessStatus === 'Résolu' ? 'ok' : 'pending';
      return `<a class="jira-link" href="${esc(state.jiraUrl || '#')}" target="_blank" rel="noopener"><span class="badge ${esc(badgeClass)}">${esc(businessStatus)}</span> Ticket créé : ${esc(state.jiraKey || '-')}</a>`;
    }

    function jiraActionHtml(anomaly) {
      const key = anomalyKey(anomaly);
      const state = jiraState[key];
      if (state?.jiraUrl && state?.jiraKey) {
        return `<div class="jira-actions"><a class="btn detail-btn" href="${esc(state.jiraUrl)}" target="_blank" rel="noopener">Consulter / modifier</a></div>`;
      }
      const label = state?.status === 'error' ? 'Réessayer' : 'Créer dans Jira';
      const disabled = state?.status === 'loading' ? 'disabled' : '';
      return `<div class="jira-actions"><button class="btn detail-btn" data-create-jira="${esc(key)}" type="button" ${disabled}>${esc(label)}</button></div>`;
    }

    function anomalyForTest(test) {
      return detectedAnomalies().find((anomaly) => anomaly.testId === test.id) || null;
    }

    function detailJiraActionHtml(test) {
      const anomaly = anomalyForTest(test);
      if (!anomaly) return '';
      const key = anomalyKey(anomaly);
      const state = jiraState[key];
      if (state?.jiraUrl && state?.jiraKey) {
        const label = state.alreadyExists ? '↻ Ticket Jira déjà créé pour ce problème' : 'Ticket créé';
        const className = state.alreadyExists ? 'jira existing-ticket' : 'jira';
        return `<a class="${className}" href="${esc(state.jiraUrl)}" target="_blank" rel="noopener">${esc(label)} : ${esc(state.jiraKey)}</a>`;
      }
      const label = state?.status === 'loading'
        ? 'Création Jira...'
        : state?.status === 'error'
          ? 'Erreur Jira - Réessayer'
          : 'Créer dans Jira';
      const disabled = state?.status === 'loading' ? 'disabled' : '';
      const login = state?.status === 'error'
        ? '<button class="jira" data-open-jira-login type="button">Ouvrir connexion Jira</button>'
        : '';
      return `<button class="jira" data-detail-create-jira="${esc(key)}" type="button" ${disabled}>${esc(label)}</button>${login}`;
    }

    function renderReports() {
      const anomalies = detectedAnomalies();
      const target = document.getElementById('reportCards');
      if (!target) return;
      if (!anomalies.length) {
        target.innerHTML = '<div class="subtitle" style="padding:14px">Aucune anomalie détectée pour le filtre actuel.</div>';
        return;
      }
      const maxPage = Math.max(0, Math.ceil(anomalies.length / anomalyPageSize) - 1);
      if (anomalyPage > maxPage) anomalyPage = maxPage;
      const visibleAnomalies = anomalies.slice(anomalyPage * anomalyPageSize, anomalyPage * anomalyPageSize + anomalyPageSize);
      target.innerHTML = `
        <div class="anomaly-pager">
          <span>${esc(anomalyPage * anomalyPageSize + 1)}-${esc(Math.min((anomalyPage + 1) * anomalyPageSize, anomalies.length))} / ${esc(anomalies.length)}</span>
          <button type="button" data-anomaly-page="prev" ${anomalyPage <= 0 ? 'disabled' : ''}>&lsaquo;</button>
          <button type="button" data-anomaly-page="next" ${anomalyPage >= maxPage ? 'disabled' : ''}>&rsaquo;</button>
        </div>
        <div class="anomaly-table-wrap">
          <table class="anomaly-table">
            <thead><tr>
              <th>École</th><th>Environnement</th><th>Type anomalie</th><th>Date exécution</th><th>Criticité</th><th>Statut Jira</th><th>Action</th>
            </tr></thead>
            <tbody>
              ${visibleAnomalies.map((anomaly) => `
                <tr>
                  <td><strong>${esc(anomaly.schoolName)}</strong></td>
                  <td>${esc(anomaly.environment)}</td>
                  <td>${esc(anomaly.anomalyType)}</td>
                  <td class="date-cell">${esc(anomaly.executionDate || '-')}</td>
                  <td><span class="badge ${esc(criticalityBadgeClass(anomalyCriticality(anomaly)))}">${esc(anomalyCriticality(anomaly))}</span></td>
                  <td>${jiraStatusHtml(anomaly)}</td>
                  <td>${jiraActionHtml(anomaly)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
      document.querySelectorAll('[data-create-jira]').forEach((button) => {
        const anomaly = anomalies.find((item) => anomalyKey(item) === button.dataset.createJira);
        if (anomaly) button.addEventListener('click', () => createJiraIssue(anomaly));
      });
      document.querySelectorAll('[data-anomaly-page]').forEach((button) => {
        button.addEventListener('click', () => {
          anomalyPage += button.dataset.anomalyPage === 'next' ? 1 : -1;
          renderReports();
        });
      });
    }

    async function createJiraIssue(anomaly) {
      const key = anomalyKey(anomaly);
      jiraState = { ...jiraState, [key]: { status: 'loading' } };
      renderReports();
      renderDetail();
      try {
        const response = await fetch(apiUrl('/api/jira/create-issue'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(anomaly),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.success) throw new Error(payload.message || 'Erreur Jira');
        jiraState = {
          ...jiraState,
          [key]: {
            status: 'created',
            alreadyExists: Boolean(payload.alreadyExists),
            jiraKey: payload.jiraKey,
            jiraUrl: payload.jiraUrl,
            jiraStatus: payload.jiraStatus,
            jiraStatusCategory: payload.jiraStatusCategory,
          },
        };
      } catch (error) {
        jiraState = { ...jiraState, [key]: { status: 'error', message: error.message || 'Erreur Jira' } };
        showRunMessage(error.message || 'Erreur Jira', 'error');
      }
      renderReports();
      renderDetail();
    }

    async function openJiraLogin() {
      showRunMessage('Ouverture de la fenêtre Jira pour connexion...');
      try {
        const response = await fetch(apiUrl('/api/jira-login'), { method: 'POST' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok) throw new Error(payload.message || 'Ouverture Jira impossible');
        showRunMessage(payload.message || 'Fenêtre Jira ouverte. Connecte-toi puis réessaie la création du ticket.');
      } catch (error) {
        showRunMessage(error.message || 'Ouverture Jira impossible', 'error');
      }
    }

    function selectedTest() {
      return tests().find((test) => test.id === selectedId) || tests()[0] || {};
    }

    function eudonetBusinessLabelForDetail(test) {
      if (test.eudonetStatus === 'running') return 'En cours';
      if (test.eudonetStatus === 'passed') return 'OK';
      if (test.eudonetStatus === 'failed') return 'KO';
      if (test.eudonetStatus === 'blocked') return 'Bloque';
      return 'Non exécuté';
    }

    function detailCheckClass(status) {
      const text = String(status || '').toUpperCase();
      if (text === 'OK' || text === 'PASSED' || text === 'REUSSI') return 'ok';
      if (text === 'KO' || text === 'FAILED' || text === 'ECHEC') return 'ko';
      if (text === 'BLOQUE' || text === 'BLOCKED') return 'blocked';
      return 'pending';
    }

    function detailIssueChecks(checks = []) {
      return checks.filter((check) => String(check.status || '').toUpperCase() !== 'OK');
    }

    function detailAllEudonetChecks(report) {
      if (!report) return [];
      return [
        ...(report.programChoiceChecks || []),
        ...(report.identificationChecks || []),
        ...(report.educationChecks || []),
        ...(report.documentChecks || []),
        ...(report.recapChecks || []),
      ];
    }

    function detailJddValue(test, champ) {
      const rows = Array.isArray(test.jddData?.rows) ? test.jddData.rows : [];
      return rows.find((row) => row.champ === champ)?.valeur || '';
    }

    function detailEudonetReason(test) {
      const report = test.eudonetReport;
      if (!report) {
        return test.status === 'passed'
          ? "le contrôle Eudonet n'a pas encore été lancé pour cette exécution."
          : "le contrôle Eudonet est ignoré tant que NewForm n'est pas OK.";
      }
      const failed = detailAllEudonetChecks(report).find((check) => String(check.status || '').toUpperCase() === 'KO');
      if (!report.recordOpened) {
        return report.candidateVisible
          ? "le candidat est trouvé dans la liste Eudonet, mais la fiche candidat ne s'ouvre pas."
          : "le candidat généré depuis NewForm n'a pas été retrouvé dans Eudonet.";
      }
      if (report.blockingReason) return report.blockingReason;
      if (failed) return `${failed.label || 'un contrôle'} : ${failed.detail || 'valeur non retrouvée'}`;
      if (report.status === 'OK') return 'le candidat et les données contrôlées sont retrouvés dans Eudonet.';
      return test.journeyMessage || report.searchDetail || 'le contrôle Eudonet doit être relu.';
    }

    function detailHistoryDate(row) {
      if (row.executedAtHuman) return row.executedAtHuman;
      if (!row.executedAt) return '-';
      const date = new Date(row.executedAt);
      if (Number.isNaN(date.getTime())) return row.executedAt;
      return new Intl.DateTimeFormat('fr-FR', { dateStyle: 'short', timeStyle: 'short' }).format(date);
    }

    function detailHistoryResult(row) {
      const status = String(row.status || '').toLowerCase();
      const newform = String(row.newformStatus || '').toLowerCase();
      const eudonet = String(row.eudonetStatus || '').toLowerCase();
      if (status === 'running' || status === 'queued') return { label: 'En cours', tone: 'running', icon: '...' };
      if (newform === 'failed' || status === 'failed') return { label: 'Échec NewForm', tone: 'ko', icon: '!' };
      if (newform === 'blocked' || status === 'blocked') return { label: 'Warning', tone: 'blocked', icon: '!' };
      if ((newform === 'passed' || status === 'passed') && eudonet === 'failed') return { label: 'KO', tone: 'ko', icon: '!' };
      if ((newform === 'passed' || status === 'passed') && !eudonet) return { label: 'Eudonet non lancé', tone: 'pending', icon: '-' };
      if (status === 'passed') return { label: 'OK', tone: 'ok', icon: 'O' };
      return { label: 'Non exécuté', tone: 'pending', icon: '-' };
    }

    function detailHistoryFallbackRow(test) {
      return {
        id: `${test.id || test.schoolSlug || 'execution'}-current`,
        school: test.school || '-',
        schoolSlug: test.schoolSlug || '',
        journeyGroup: test.journeyGroup || '',
        scenario: test.manualScenario?.title || test.scenario || 'Parcours candidat standard',
        environment: test.environment || campaign?.environment || '',
        environmentCode: test.environmentCode || normalizeEnv(test.environment || campaign?.environment || currentEnvironment || 'REC'),
        status: test.status || 'pending',
        newformStatus: test.status || 'pending',
        eudonetStatus: test.eudonetStatus || '',
        durationSec: test.durationSec || 0,
        executedAt: test.executedAt || campaign?.executedAt || '',
        executedAtHuman: test.executedAtHuman || '',
      };
    }

    function detailHistoryRows(test) {
      const selectedSchool = String(test.schoolSlug || test.school || '').toLowerCase();
      const selectedEnv = normalizeEnv(test.environmentCode || test.environment || campaign?.environment || currentEnvironment || 'REC');
      const rows = (Array.isArray(test.executionHistory) && test.executionHistory.length
        ? test.executionHistory
        : [detailHistoryFallbackRow(test)])
        .filter((row) => {
          const rowSchool = String(row.schoolSlug || row.school || '').toLowerCase();
          return !selectedSchool || rowSchool === selectedSchool;
        });
      const schoolRows = rows.length ? rows : [detailHistoryFallbackRow(test)];
      const envRows = schoolRows.filter((row) => normalizeEnv(row.environmentCode || row.environment || '') === selectedEnv);
      const filteredRows = envRows.length ? envRows : schoolRows;
      return filteredRows
        .slice()
        .sort((left, right) => detailHistoryTime(right) - detailHistoryTime(left));
    }

    function detailHistoryTime(row) {
      const raw = row?.executedAt || row?.executedAtHuman || '';
      const direct = Date.parse(raw);
      if (direct) return direct;
      const fr = String(raw).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\D+(\d{1,2}):(\d{2}))?/);
      if (!fr) return 0;
      const [, day, month, year, hour = '0', minute = '0'] = fr;
      return new Date(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute)).getTime();
    }

    function filterDetailHistoryRowsByDate(rows) {
      const fromTime = historyDateFrom ? new Date(`${historyDateFrom}T00:00:00`).getTime() : 0;
      const toTime = historyDateTo ? new Date(`${historyDateTo}T23:59:59.999`).getTime() : 0;
      return rows.filter((row) => {
        const rowTime = detailHistoryTime(row);
        if (!rowTime) return !fromTime && !toTime;
        if (fromTime && rowTime < fromTime) return false;
        if (toTime && rowTime > toTime) return false;
        return true;
      });
    }

    function renderDetailHistoryRows(rows) {
      if (!rows.length) {
        return '<p class="execution-history__empty">Aucune exécution disponible pour cette période.</p>';
      }
      return `<div class="execution-history__list">${rows.map((row) => {
        const result = detailHistoryResult(row);
        const duration = row.durationSec ? ` - ${Math.round(row.durationSec)}s` : '';
        const env = normalizeEnv(row.environmentCode || row.environment || '');
        return `
          <div class="execution-history__row">
            <span class="execution-history__icon ${result.tone}">${esc(result.icon)}</span>
            <span class="execution-history__main">
              <strong title="${esc(row.scenario || 'Parcours candidat standard')}">${esc(row.scenario || 'Parcours candidat standard')}</strong>
              <span class="execution-history__meta">${esc(row.school || '-')} - ${esc(detailHistoryDate(row))} - ${esc(env || row.environment || '-')}${duration}</span>
            </span>
            <span class="execution-history__badge ${result.tone}">${esc(result.label)}</span>
          </div>`;
      }).join('')}</div>`;
    }

    function renderDetailHistoryPreview(test) {
      const rows = detailHistoryRows(test);
      return `
        <div class="execution-history">
          <div class="execution-history__head">
            <strong>Historique des exécutions</strong>
            <button type="button" data-open-history-tab>Voir tout</button>
          </div>
          ${renderDetailHistoryRows(rows.slice(0, 3))}
        </div>`;
    }

    function renderDetailHistoryTab(test) {
      const allRows = detailHistoryRows(test);
      const hasDateFilter = Boolean(historyDateFrom || historyDateTo);
      const shouldShowRows = hasDateFilter || historyShowAll;
      const filteredRows = historyShowAll ? allRows : (hasDateFilter ? filterDetailHistoryRowsByDate(allRows) : []);
      return `
        <div class="detail-panel">
          <div class="execution-history">
            <div class="execution-history__head">
              <strong>Historique des exécutions (${esc(shouldShowRows ? filteredRows.length : 0)} / ${esc(allRows.length)})</strong>
            </div>
            <div class="execution-history__calendar">
              <div class="execution-history__calendar-title">
                <span>Période d'exécution</span>
                <button type="button" id="historyDateReset">Réinitialiser</button>
              </div>
              <div class="execution-history__calendar-range">
                <label>Du
                  <input id="historyDateFrom" type="date" value="${esc(historyDateFrom)}">
                </label>
                <label>Au
                  <input id="historyDateTo" type="date" value="${esc(historyDateTo)}">
                </label>
              </div>
              <div class="execution-history__presets" aria-label="Raccourcis période">
                <button type="button" data-history-range="today">Aujourd'hui</button>
                <button type="button" data-history-range="7">7 jours</button>
                <button type="button" data-history-range="30">30 jours</button>
                <button type="button" data-history-range="all">Tout</button>
              </div>
            </div>
            ${shouldShowRows
              ? renderDetailHistoryRows(filteredRows)
              : '<p class="execution-history__empty">Choisir une date de début ou de fin pour afficher l historique.</p>'}
          </div>
        </div>`;
    }

    function renderDetailSummaryTab(test, newform) {
      const paymentAccepted = String(test.paymentStatus || '').toLowerCase() === 'accepted';
      const eudonetOk = test.eudonetStatus === 'passed';
      const eudonetLaunched = Boolean(test.eudonetStatus);
      const eudonetBlocked = test.eudonetStatus === 'blocked';
      const newformOk = test.status === 'passed';
      const exactError = test.errorMessage || test.suspectedCause || '';
      const eudonetIntro = eudonetOk
          ? 'Le contrôle Eudonet est réussi :'
          : eudonetBlocked
            ? 'Le contrôle Eudonet est bloqué :'
            : 'Le contrôle Eudonet est en échec :';
      return `
        <div class="detail-message">
          <p>${newformOk ? "La candidature a été remplie jusqu'au bout dans NewForm." : 'NewForm est bloqué avant la fin du parcours.'}</p>
          ${!newformOk && exactError ? `<p><strong>Erreur exacte :</strong><br>${esc(exactError)}</p>` : ''}
          ${!newformOk && test.blockedStep ? `<p><strong>Étape bloquée :</strong> ${esc(test.blockedStep)}</p>` : ''}
          ${paymentAccepted ? '<p>Le paiement de test a été accepté.</p>' : ''}
          ${eudonetLaunched ? `<p>${eudonetIntro}<br>${esc(detailEudonetReason(test))}</p>` : ''}
        </div>`;
    }

    function renderDetailNewFormTab(test, newform) {
      const candidateName = [detailJddValue(test, 'Candidat genere - prenom'), detailJddValue(test, 'Candidat genere - nom')].filter(Boolean).join(' ') || '-';
      const rows = [
        ['Résultat', newform.label],
        ['École', test.school || '-'],
        ['Environnement', test.environment || test.environmentCode || campaign?.environment || 'Recette'],

      return `
        <div class="eudonet-summary">
          ${rows.map(([label, value]) => `<div class="eudonet-summary-row"><strong>${esc(label)}</strong><span>${esc(value)}</span></div>`).join('')}
        </div>`;

    function renderDetailCheckGroup(title, checks = []) {
      const rows = detailIssueChecks(checks);
      if (!rows.length) return '';
      return `
        <div class="eudonet-check-group">
          <strong>${esc(title)}</strong>
          ${rows.map((check) => `
            <div class="eudonet-check-row">
              <span>${esc(check.label || check.key || '-')}<small>${esc(check.detail || check.expected || '-')}</small></span>
              <span class="badge ${detailCheckClass(check.status)}">${esc(check.status || '-')}</span>
            </div>`).join('')}
        </div>`;

    function renderDetailDocumentEvidence(evidence) {
      const rows = (Array.isArray(evidence?.eudonetDetectedDocuments) ? evidence.eudonetDetectedDocuments : []).filter((doc) => !doc.detected);
      if (!rows.length) return '';
      return `
        <div class="eudonet-check-group">
          <strong>Documents NewForm / Eudonet${evidence.newFormUploadSummary ? ` - ${esc(evidence.newFormUploadSummary)}` : ''}</strong>
          ${rows.map((doc) => `
            <div class="eudonet-check-row">
              <span>${esc(doc.label || '-')}<small>${esc(doc.filePath || 'Fichier NewForm non renseigné')}</small></span>
              <span class="badge ko">ABSENT</span>
            </div>`).join('')}
        </div>`;
    }

    function renderDetailEudonetTab(test) {
      const report = test.eudonetReport;
      if (!report) return `<div class="detail-message"><p>${esc(detailEudonetReason(test))}</p></div>`;
      const issueCount = detailIssueChecks(detailAllEudonetChecks(report)).length;
      return `
        <div class="detail-panel">
          <div class="eudonet-summary">
            <div class="eudonet-summary-row"><strong>Résultat</strong><span><span class="badge ${detailCheckClass(report.status)}">${esc(report.status || '-')}</span></span></div>
            <div class="eudonet-summary-row"><strong>Candidat</strong><span>${esc(report.candidateEmail || report.candidateId || '-')}</span></div>
            <div class="eudonet-summary-row"><strong>Ouverture fiche</strong><span>${report.recordOpened ? 'Fiche candidat ouverte' : 'Fiche non ouverte dans Eudonet'}</span></div>
            <div class="eudonet-summary-row"><strong>Lecture métier</strong><span>${esc(detailEudonetReason(test))}</span></div>
          </div>
          ${issueCount ? '' : '<div class="detail-message"><p>Tous les contrôles Eudonet sont OK.</p></div>'}
          <div class="eudonet-check-groups">
            ${renderDetailCheckGroup('Choix du programme', report.programChoiceChecks || [])}
            ${renderDetailCheckGroup('Identification', report.identificationChecks || [])}
            ${renderDetailCheckGroup('Parcours scolaire', report.educationChecks || [])}
            ${renderDetailCheckGroup('Pièces justificatives', report.documentChecks || [])}
            ${renderDetailDocumentEvidence(report.documentEvidence)}
            ${renderDetailCheckGroup('Récapitulatif', report.recapChecks || [])}
          </div>
        </div>`;
    }

    function renderDetailScenarioTab(test) {
      const scenario = test.manualScenario;
      if (!scenario) {
        return "<div class=\"detail-message\"><p>Aucun scénario personnalisé détaillé n'est rattaché à cette exécution.</p></div>";
      }
      const checkpoints = Array.isArray(scenario.eudonetCheckpoints) ? scenario.eudonetCheckpoints : [];
      const points = Array.isArray(scenario.pointsToTreat) ? scenario.pointsToTreat : [];
      const steps = Array.isArray(scenario.steps) ? scenario.steps : [];
      const actions = scenario.actionFlags || {};
      const actionLabels = {
        createCandidate: 'Candidat créé',
        uniqueEmail: 'Email unique',
        uploadDocuments: 'PJ déposées',
        replaceDocument: 'PJ remplacée',
        validateStep2: 'Étape 2 validée',
        modifyPersonalInfo: 'Information personnelle modifiée',
        validateStep3: 'Informations validées',
        checkEudonet: 'Contrôle Eudonet',
        verifyDownloadLinks: 'Liens de téléchargement vérifiés',
      };

    function detailCsvEscape(value) {
      const text = String(value ?? '');
      return /[",\n;]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function downloadDetailJdd(test, format) {
      const rows = Array.isArray(test.jddData?.rows) ? test.jddData.rows : [];
      if (!rows.length) return;
      const safeSchool = String(test.schoolSlug || test.school || 'newform').replace(/[^a-z0-9_-]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase();
      const content = format === 'csv'
        ? `Champ;Valeur\n${rows.map((row) => `${detailCsvEscape(row.champ)};${detailCsvEscape(row.valeur)}`).join('\n')}`
        : JSON.stringify(rows, null, 2);
      const blob = new Blob([content], { type: format === 'csv' ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `jdd-${safeSchool}.${format}`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function statusTone(status) {
      const text = String(status || '').toLowerCase();
      if (/succes|succès|success|completed$/.test(text)) return 'ok';
      if (/ko|issue|failed|erreur/.test(text)) return 'ko';
      if (/bloque|bloqué|stopped|block/.test(text)) return 'blocked';
      return 'pending';
    }

    function normalizeLiveBrowser(job = null) {
      const live = job?.liveBrowser || null;
      if (live) {
        return {
          ...live,
          executionType: liveExecutionTypeLabel(job) || live.executionType,
        };
      }
      if (!job) return null;
      return {
        projectName: job.project || 'NewForm',
        executionId: job.id || '',
        executionType: liveExecutionTypeLabel(job),
        liveUrl: job.liveUrl || '',
        status: job.status === 'queued' ? 'En attente' : job.status === 'running' ? 'En cours' : job.status === 'completed' ? 'Succès' : job.status === 'completed-with-issues' ? 'KO' : job.status === 'stopped' ? 'Bloqué' : (job.status || ''),
        rawStatus: job.status || '',
        currentStep: job.currentStep || job.currentSchoolLabel || job.scenario || job.campaign || '',
        logs: Array.isArray(job.logLines) ? job.logLines.slice(-80) : [],
        errorMessage: job.errorMessage || '',
        mode: job.liveBrowser?.mode || (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'local' : 'serveur'),
        headless: job.liveBrowser?.headless || {},
        liveUrlConfigured: Boolean(job.liveUrl),
      };
    }

    function headlessLabel(value) {
      if (String(value) === '1') return 'active';
      if (String(value) === '0') return 'désactivé';
      return 'non précisé';

    function liveBrowserEmptyHtml(live) {

            </div>

              <div><span>Headless</span><b>NewForm ${esc(newformHeadless)}</b></div>

            </div>

          </div>

    function subscribeLiveBrowserEvents(executionId) {
      if (!executionId || typeof EventSource === 'undefined') return;
      if (liveBrowserEventSource?.executionId === executionId) return;
      if (liveBrowserEventSource) liveBrowserEventSource.close();
      const source = new EventSource(apiUrl(`/api/executions/${encodeURIComponent(executionId)}/events`));
      source.executionId = executionId;
      source.addEventListener('live', (event) => {
        try {
          updateLiveBrowser(JSON.parse(event.data || '{}'), { fromEvent: true });
        } catch {
          // Polling reste actif si un événement SSE est illisible.
        }
      });
      source.addEventListener('error', () => {
        source.close();
        if (liveBrowserEventSource === source) liveBrowserEventSource = null;
      });
      liveBrowserEventSource = source;
    }

    function closeLiveBrowser() {
      if (liveBrowserState?.executionId) liveBrowserClosedForExecutionId = liveBrowserState.executionId;
      const host = document.getElementById('liveBrowserHost');
      if (host) host.innerHTML = '';
      liveBrowserState = null;
      if (liveBrowserEventSource) {
        liveBrowserEventSource.close();
        liveBrowserEventSource = null;
      }
    }

    function setLiveBrowserMode(mode) {
      liveBrowserMode = mode || 'embedded';
      const host = document.getElementById('liveBrowserHost');
      if (host) host.innerHTML = '';
    }

    function updateLiveBrowser(liveOrJob, options = {}) {
      const live = liveOrJob?.executionId ? liveOrJob : normalizeLiveBrowser(liveOrJob);
      if (!live?.executionId) return;
      if (!options.forceOpen && liveBrowserClosedForExecutionId === live.executionId) return;
      liveBrowserState = {
        ...(liveBrowserState?.executionId === live.executionId ? liveBrowserState : {}),
        ...live,
        logs: Array.isArray(live.logs) ? live.logs : [],
      };
      subscribeLiveBrowserEvents(live.executionId);
      const host = document.getElementById('liveBrowserHost');
      if (host) host.innerHTML = '';
      renderResultsFocus();
    }

      const host = document.getElementById('liveBrowserHost');

      const shell = host.querySelector('.live-browser');
      const needsShell = !shell
        || shell.dataset.executionId !== live.executionId
        || shell.dataset.liveUrl !== (live.liveUrl || '');

      if (needsShell) {
        host.innerHTML = `
          <section class="live-browser show ${modeClass}" data-execution-id="${esc(live.executionId)}" data-live-url="${esc(live.liveUrl || '')}" aria-label="Live Browser">

                <button type="button" data-live-mode="expanded" title="Agrandir" aria-label="Agrandir">[]</button>

              </div>
              <div class="live-browser-frame">
                ${live.liveUrl ? `<iframe src="${esc(live.liveUrl)}" title="Navigateur Playwright live" allow="fullscreen; clipboard-read; clipboard-write"></iframe>` : liveBrowserEmptyHtml(live)}
              </div>
            </div>
          </section>

    async function fetchJsonWithLocalFallback(path) {
      const urls = [
        `${path}${path.includes('?') ? '&' : '?'}t=${Date.now()}`,
        `http://127.0.0.1:4173${path}${path.includes('?') ? '&' : '?'}t=${Date.now()}`,
      ];
      let lastError = null;
      for (const url of urls) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('API inaccessible');
    }

    async function loadCampaign() {
      try {
        campaign = await fetchJsonWithLocalFallback(`/api/campaign-data?campaign=${encodeURIComponent(selectedCampaignId())}`);

        try {
          renderAll();
        } catch (renderError) {
          console.error(renderError);
          selectedId = '';
          renderMetrics();
          renderResultsFocus();
          renderTable();
          renderReports();

      } catch (error) {
        document.getElementById('metrics').innerHTML = '';
        const focus = document.getElementById('resultsFocus');
        if (focus) focus.innerHTML = '';
        document.getElementById('tableWrap').innerHTML = `<div class="subtitle" style="padding:18px">Impossible de charger les exécutions NewForm : ${esc(error.message || error)}</div>`;
        const reportCards = document.getElementById('reportCards');
        if (reportCards) reportCards.innerHTML = '';
        return null;
      }
    }

    async function syncCurrentJob() {
      const payload = await fetchJsonWithLocalFallback('/api/jobs/current').catch(() => null);
      const job = payload?.job;
      if (job && (job.status === 'running' || job.status === 'queued')) {
        currentJobId = job.id;
        currentRunMode = job.mode || 'all';
        activeExecutionJob = job;
        renderLiveExecution(job);
        showRunMessage(`Exécution déjà en cours : ${job.totalSchools || 0} école(s). Tu peux l'arrêter avec Stop.`);
        pollJob();
        return;
      }
      const qaPayload = await fetchJsonWithLocalFallback('/api/qa-jobs').catch(() => null);
      const qaJob = qaPayload?.running;
      if (qaJob && (qaJob.status === 'running' || qaJob.status === 'queued')) {
        currentQaJobId = qaJob.id;
        scenarioRunStatus = 'En cours';
        updateLiveBrowser(qaJob, { forceOpen: true });
        renderLiveExecution(qaJob);
        showRunMessage(`${liveExecutionTypeLabel(qaJob)} en cours : ${qaJob.scenario || qaJob.campaign || 'exécution agent'}.`);
        pollQaJob();
        return;
      }
      currentJobId = '';
      currentRunMode = '';
      activeExecutionJob = null;
      renderResultsFocus();
    }

    async function refreshCampaignAfterCompletedJob(job = {}) {
      const displayCampaignId = selectedCampaignId();
      const launchedCampaignId = job.campaignId || displayCampaignId;
      const targetSlugs = Array.isArray(job.schoolSlugs) && job.schoolSlugs.length
        ? job.schoolSlugs.map((slug) => String(slug || '').trim().toLowerCase()).filter(Boolean)
        : [String(job.schoolSlug || '').trim().toLowerCase()].filter(Boolean);
      const displayPayload = await fetchJsonWithLocalFallback(`/api/campaign-data?campaign=${encodeURIComponent(displayCampaignId)}`);
      campaign = displayPayload;

      if (targetSlugs.length && launchedCampaignId !== displayCampaignId) {
        const launchedPayload = await fetchJsonWithLocalFallback(`/api/campaign-data?campaign=${encodeURIComponent(launchedCampaignId)}`);
        const launchedBySchool = new Map((Array.isArray(launchedPayload.tests) ? launchedPayload.tests : []).map((test) => [test.schoolSlug, test]));
        const nextOverrides = { ...executionResultOverrides };
        targetSlugs.forEach((schoolSlug) => {
          const launchedTest = launchedBySchool.get(schoolSlug);
          if (launchedTest) {
            nextOverrides[schoolSlug] = {
              ...launchedTest,
              environment: launchedTest.environment || launchedPayload.environment || environmentFromCampaignId(launchedCampaignId),
              environmentCode: launchedTest.environmentCode || environmentFromCampaignId(launchedCampaignId),
            };
          }
        });
        executionResultOverrides = nextOverrides;
      } else {
        const nextOverrides = { ...executionResultOverrides };
        targetSlugs.forEach((schoolSlug) => delete nextOverrides[schoolSlug]);
        executionResultOverrides = nextOverrides;
      }

      renderAll(false);
    }

    async function runCampaign(mode, schoolSlug = '', campaignId = selectedCampaignId(), scenarioConfig = null) {
      showRunMessage("Démarrage de l'exécution...");
      try {
        const response = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode, schoolSlug, autoPayment: true, campaignId, scenarioConfig }),
        });
        const job = await response.json().catch(() => ({}));
        if (!response.ok) {
          if ((job.error || '').includes('deja en cours')) {
            await syncCurrentJob();
            renderAll(false);
          }
          showRunMessage(job.error || "Impossible de lancer l'exécution.", 'error');
          return;
        }
        job.type = job.type || 'newform';
        currentJobId = job.id;
        currentRunMode = mode;
        activeExecutionJob = job;
        showRunMessage(`Exécution lancée : ${job.totalSchools || 0} école(s). Le bouton devient Stop pendant le run.`);
        updateLiveBrowser(job, { forceOpen: true });
        renderAll(false);
        pollJob();
      } catch (error) {
        showRunMessage(`Impossible de contacter le serveur dashboard : ${error.message || error}`, 'error');
      }
    }

    async function runJourney(mode = 'school', schoolSlug = '', campaignId = selectedCampaignId(), scenarioConfig = null) {
      showRunMessage('Démarrage du parcours NewForm + Eudonet...');
      try {
        const response = await fetch('/api/journey-execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode, schoolSlug, autoPayment: true, campaignId, scenarioConfig }),
        });
        const job = await response.json().catch(() => ({}));
        if (!response.ok) {
          if ((job.error || '').includes('deja en cours')) {
            await syncCurrentJob();
            renderAll(false);
          }
          showRunMessage(job.error || 'Impossible de lancer le parcours NewForm + Eudonet.', 'error');
          return;
        }
        job.type = 'journey';
        currentJobId = job.id;
        currentRunMode = mode;
        activeExecutionJob = job;
        showRunMessage(`Parcours lancé : ${job.totalSchools || 0} école(s).`);
        updateLiveBrowser(job, { forceOpen: true });
        renderAll(false);
        pollJob();
      } catch (error) {
        showRunMessage(`Impossible de contacter le serveur dashboard : ${error.message || error}`, 'error');
      }
    }

    async function pollJob() {
      if (!currentJobId) return;
      const job = await fetch(`/api/jobs/${currentJobId}`, { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
      if (!job) return;
      activeExecutionJob = isJobRunning(job) ? job : null;
      renderLiveExecution(job);
      if (job.status === 'running' || job.status === 'queued') setTimeout(pollJob, 2200);
      else {
        currentJobId = '';
        currentRunMode = '';
        activeExecutionJob = null;
        showRunMessage('Exécution terminée. Les résultats sont rafraîchis.');
        refreshCampaignAfterCompletedJob(job)
          .then(() => {
            setTimeout(() => loadCampaign(), 1200);
            setTimeout(() => loadCampaign(), 3500);
          })
          .catch(() => loadCampaign());
      }
    }

    async function pollQaJob() {
      if (!currentQaJobId) return;
      const job = await fetch(apiUrl(`/api/qa-jobs/${encodeURIComponent(currentQaJobId)}`), { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
      if (!job) return;
      activeExecutionJob = isJobRunning(job) ? job : null;
      renderLiveExecution(job);
      if (job.status === 'running' || job.status === 'queued') {
        setTimeout(pollQaJob, 2200);
        return;
      }
      currentQaJobId = '';
      activeExecutionJob = null;
      scenarioRunStatus = job.status === 'completed' ? 'Terminé' : job.status === 'stopped' ? 'Bloqué' : 'KO';
      scenarioModalMessage = job.errorMessage || (scenarioRunStatus === 'Terminé' ? 'Exécution terminée. Les résultats sont rafraîchis.' : 'Exécution terminée avec anomalie.');
      scenarioModalMessageType = scenarioRunStatus === 'Terminé' ? 'success' : 'error';
      showRunMessage(scenarioModalMessage, scenarioModalMessageType === 'error' ? 'error' : '');
      renderScenarioLauncher();
      loadCampaign();
    }

    async function stopCurrentJob() {
      if (!currentJobId) return;
      const jobId = currentJobId;
      try {
        await fetch(`/api/jobs/${jobId}/stop`, { method: 'POST' });
      } catch {
        // Le rafraîchissement local reste utile si le serveur ne répond pas.
      }
      currentJobId = '';
      currentRunMode = '';
      activeExecutionJob = null;
      showRunMessage("Demande d'arrêt envoyée. Les résultats sont rafraîchis.");
      renderAll(false);
      loadCampaign();
    }

    document.getElementById('envFilter')?.addEventListener('change', (event) => {
      syncEnvironmentSelectors(event.target.value || 'REC');
      executionResultOverrides = {};
      selectedId = '';
      tablePage = 0;
      loadCampaign();
    });
    ['heroRunEnv', 'railEudonetEnv'].forEach((id) => {
      document.getElementById(id)?.addEventListener('change', (event) => {
        event.target.value = normalizeEnv(event.target.value || 'REC');
      });
    });
    function openRailPanel(panelId) {
      const selected = document.getElementById(panelId);
      const shouldClose = selected?.classList.contains('is-open');
      ['newformRunPanel', 'journeyRunPanel'].forEach((id) => {
        document.getElementById(id)?.classList.toggle('is-open', !shouldClose && id === panelId);
      });
    }
    ['statusFilter', 'searchInput'].forEach((id) => document.getElementById(id)?.addEventListener('input', () => {
      tablePage = 0;
      renderAll(false);
    }));
    document.getElementById('heroLaunchBtn')?.addEventListener('click', runSelectedNewForm);
    document.getElementById('heroReplayBtn')?.addEventListener('click', runSelectedNewForm);
    document.getElementById('heroStopBtn')?.addEventListener('click', stopCurrentJob);
    document.addEventListener('click', (event) => {
      if (event.target.closest('.table-actions') || event.target.closest('#rowActionMenu')) return;
      closeActionMenu();
    });
    window.addEventListener('resize', closeActionMenu);
    document.getElementById('menuNewFormBtn')?.addEventListener('click', () => openRailPanel('newformRunPanel'));
    document.getElementById('menuJourneyBtn')?.addEventListener('click', () => openRailPanel('journeyRunPanel'));
    document.getElementById('menuScenarioBtn')?.addEventListener('click', openScenarioModal);
    document.getElementById('railEudonetSchool')?.addEventListener('change', (event) => {
      const found = tests().find((test) => test.schoolSlug === event.target.value);
      if (found) {
        selectedId = found.id;
        renderAll(false);
      }
    });
    document.getElementById('railEudonetLaunchBtn')?.addEventListener('click', runSelectedJourney);
    document.getElementById('railEudonetReplayBtn')?.addEventListener('click', runSelectedJourney);
    document.getElementById('railEudonetStopBtn')?.addEventListener('click', stopCurrentJob);
    document.getElementById('resetBtn').addEventListener('click', () => {
      syncEnvironmentSelectors('REC');
      executionResultOverrides = {};
      if (document.getElementById('appFilter')) document.getElementById('appFilter').value = 'all';
      document.getElementById('statusFilter').value = '';
      document.getElementById('searchInput').value = '';
      selectedId = '';
      tablePage = 0;
      loadCampaign();
    });
    (function trackDashboardUsage() {
      try {
        const key = 'qa-dashboard-session-id';
        let id = localStorage.getItem(key);
        if (!id) {
          id = `sess-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          localStorage.setItem(key, id);
        }
        fetch('/api/dashboard-usage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: id, page: 'newform' })
        }).catch(() => {});
      } catch (error) {}
    })();
    document.getElementById('applicationsToggle')?.addEventListener('click', () => {
      const menu = document.getElementById('applicationsMenu');
      const button = document.getElementById('applicationsToggle');
      const collapsed = menu?.classList.toggle('collapsed');
      button?.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      const caret = button?.querySelector('[data-caret]');
      if (caret) caret.textContent = collapsed ? '>' : 'v';
    });
    syncEnvironmentSelectors(currentEnvironment);
    loadCampaign();
  </script>
</body>
</html>
