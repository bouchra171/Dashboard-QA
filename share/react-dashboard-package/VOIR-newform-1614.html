        button.addEventListener('click', () => downloadDetailJdd(test, button.dataset.downloadJdd || 'json'));
      });
      document.querySelectorAll('[data-detail-create-jira]').forEach((button) => {
        const anomaly = detectedAnomalies().find((item) => anomalyKey(item) === button.dataset.detailCreateJira);
        if (anomaly) button.addEventListener('click', () => createJiraIssue(anomaly));
      });
      document.querySelectorAll('[data-open-jira-login]').forEach((button) => {
        button.addEventListener('click', openJiraLogin);
      });
      const scenarioButton = document.querySelector('[data-detail-scenario]');
      if (scenarioButton) scenarioButton.addEventListener('click', () => {
        selectedId = scenarioButton.dataset.detailScenario || selectedId;
        openScenarioModal();
      });
      const replay = document.querySelector('[data-run-detail]');
      if (replay) replay.addEventListener('click', () => {
        const campaignId = campaignIdFromEnvironment(test.environmentCode || test.environment || 'REC');
        if (fullMode) runJourney('school', replay.dataset.runDetail, campaignId);
        else runCampaign('school', replay.dataset.runDetail, campaignId);
      });
      const close = document.getElementById('closeDetail');
      if (close) close.addEventListener('click', () => document.querySelector('main').classList.remove('detail-open'));
    }

    function renderAll(updateSelection = true) {
      if (updateSelection && !selectedId && tests()[0]) selectedId = tests()[0].id;
      renderMetrics();
      renderTable();
      renderScenarioLauncher();
      renderReports();
      renderDetail();
    }

    function statusTone(status) {
      const text = String(status || '').toLowerCase();
      if (/succes|success|completed$/.test(text)) return 'ok';
      if (/ko|issue|failed|erreur/.test(text)) return 'ko';
      if (/bloque|stopped|block/.test(text)) return 'blocked';
      return 'pending';
    }

    function normalizeLiveBrowser(job = null) {
      const live = job?.liveBrowser || null;
      if (live) {
        return {
          ...live,
          executionType: liveExecutionTypeLabel(job) || live.executionType,
        };
      }
      if (!job) return null;
      return {
        projectName: job.project || 'NewForm',
        executionId: job.id || '',
        executionType: liveExecutionTypeLabel(job),
        liveUrl: job.liveUrl || '',
        status: job.status === 'queued' ? 'En attente' : job.status === 'running' ? 'En cours' : job.status === 'completed' ? 'Succes' : job.status === 'completed-with-issues' ? 'KO' : job.status === 'stopped' ? 'Bloque' : (job.status || ''),
        rawStatus: job.status || '',
        currentStep: job.currentStep || job.currentSchoolLabel || job.scenario || job.campaign || '',
        logs: Array.isArray(job.logLines) ? job.logLines.slice(-80) : [],
        errorMessage: job.errorMessage || '',
        mode: job.liveBrowser?.mode || (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'local' : 'serveur'),
        headless: job.liveBrowser?.headless || {},
        liveUrlConfigured: Boolean(job.liveUrl),
      };
    }

    function headlessLabel(value) {
      if (String(value) === '1') return 'active';
      if (String(value) === '0') return 'desactive';
      return 'non precise';
    }

    function liveBrowserEmptyHtml(live) {
      const mode = live.mode || 'local';
      const newformHeadless = headlessLabel(live.headless?.newform);
      const eudonetHeadless = headlessLabel(live.headless?.eudonet);
      return `
        <div class="live-browser-empty">
          <div class="live-browser-ready">
            <div>
              <strong>Live Browser pret</strong>
              <p>Flux navigateur integre non configure. En local, Playwright ouvre Chromium dans une fenetre separee.</p>
            </div>
            <div class="live-browser-ready-grid">
              <div><span>Mode actuel</span><b>${esc(mode)}</b></div>
              <div><span>Headless</span><b>NewForm ${esc(newformHeadless)}</b></div>
              <div><span>LiveUrl</span><b>${live.liveUrlConfigured ? 'configuree' : 'non configuree'}</b></div>
            </div>
            <p>Le suivi direct reste disponible dans la zone logs sous le tableau. Pour afficher le navigateur ici, il faut renseigner une URL live backend.</p>
          </div>
        </div>
      `;
    }

    function subscribeLiveBrowserEvents(executionId) {
      if (!executionId || typeof EventSource === 'undefined') return;
      if (liveBrowserEventSource?.executionId === executionId) return;
      if (liveBrowserEventSource) liveBrowserEventSource.close();
      const source = new EventSource(apiUrl(`/api/executions/${encodeURIComponent(executionId)}/events`));
      source.executionId = executionId;
      source.addEventListener('live', (event) => {
        try {
          updateLiveBrowser(JSON.parse(event.data || '{}'), { fromEvent: true });
        } catch {
          // Polling reste actif si un evenement SSE est illisible.
        }
      });
      source.addEventListener('error', () => {
        source.close();
        if (liveBrowserEventSource === source) liveBrowserEventSource = null;
      });
      liveBrowserEventSource = source;
    }

    function closeLiveBrowser() {
      if (liveBrowserState?.executionId) liveBrowserClosedForExecutionId = liveBrowserState.executionId;
      const host = document.getElementById('liveBrowserHost');
      if (host) host.innerHTML = '';
      liveBrowserState = null;
      if (liveBrowserEventSource) {
        liveBrowserEventSource.close();
        liveBrowserEventSource = null;
      }
    }

    function setLiveBrowserMode(mode) {
      liveBrowserMode = mode || 'embedded';
      renderLiveBrowser();
    }

    function updateLiveBrowser(liveOrJob, options = {}) {
      const live = liveOrJob?.executionId ? liveOrJob : normalizeLiveBrowser(liveOrJob);
      if (!live?.executionId) return;
      if (!options.forceOpen && liveBrowserClosedForExecutionId === live.executionId) return;
      liveBrowserState = {
        ...(liveBrowserState?.executionId === live.executionId ? liveBrowserState : {}),
        ...live,
        logs: Array.isArray(live.logs) ? live.logs : [],
      };
      subscribeLiveBrowserEvents(live.executionId);
      renderLiveBrowser();
    }

    function renderLiveBrowser() {
      const host = document.getElementById('liveBrowserHost');
      if (!host || !liveBrowserState) return;
      const live = liveBrowserState;
      const modeClass = liveBrowserMode === 'fullscreen' ? 'fullscreen' : liveBrowserMode === 'expanded' ? 'expanded' : liveBrowserMode === 'minimized' ? 'minimized' : '';
      const shell = host.querySelector('.live-browser');
      const needsShell = !shell
        || shell.dataset.executionId !== live.executionId
        || shell.dataset.liveUrl !== (live.liveUrl || '');

      if (needsShell) {
        host.innerHTML = `
          <section class="live-browser show ${modeClass}" data-execution-id="${esc(live.executionId)}" data-live-url="${esc(live.liveUrl || '')}" aria-label="Live Browser">
            <div class="live-browser-head">
              <div class="live-browser-title">
                <strong>Live Browser</strong>
                <span data-live-summary></span>
              </div>
              <div class="live-browser-actions">
                <button type="button" data-live-mode="minimized" title="Reduire" aria-label="Reduire">-</button>
                <button type="button" data-live-mode="expanded" title="Agrandir" aria-label="Agrandir">□</button>
                <button type="button" data-live-close title="Fermer" aria-label="Fermer">×</button>
              </div>
            </div>
            <div class="live-browser-body">
              <div class="live-browser-meta">
                <div><span>Origine</span><strong data-live-type></strong></div>
                <div><span>Statut</span><strong data-live-status></strong></div>
              </div>
              <div class="live-browser-frame">
                ${live.liveUrl ? `<iframe src="${esc(live.liveUrl)}" title="Navigateur Playwright live" allow="fullscreen; clipboard-read; clipboard-write"></iframe>` : liveBrowserEmptyHtml(live)}
              </div>
            </div>
          </section>
        `;
        host.querySelectorAll('[data-live-mode]').forEach((button) => {
          button.addEventListener('click', () => setLiveBrowserMode(button.dataset.liveMode));
        });
        host.querySelector('[data-live-close]')?.addEventListener('click', closeLiveBrowser);
      }

      const panel = host.querySelector('.live-browser');
      if (!panel) return;
      panel.className = `live-browser show ${modeClass}`.trim();
      panel.querySelector('[data-live-summary]').textContent = live.executionType || 'Execution';
      panel.querySelector('[data-live-type]').textContent = live.executionType || '-';
      const statusEl = panel.querySelector('[data-live-status]');
      statusEl.textContent = live.status || '-';
      statusEl.className = `badge ${statusTone(live.status || live.rawStatus)}`;
    }

    function showRunMessage(message, type = '') {
      const box = document.getElementById('runMessage');
      if (!box) return;
      box.textContent = message || '';
      box.className = `run-message ${message ? 'show' : ''} ${type}`.trim();
    }

    async function fetchJsonWithLocalFallback(path) {
      const urls = [
        `${path}${path.includes('?') ? '&' : '?'}t=${Date.now()}`,
        `http://127.0.0.1:4173${path}${path.includes('?') ? '&' : '?'}t=${Date.now()}`,
      ];
      let lastError = null;
      for (const url of urls) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('API inaccessible');
    }

    async function loadCampaign() {
      try {
        campaign = await fetchJsonWithLocalFallback(`/api/campaign-data?campaign=${encodeURIComponent(selectedCampaignId())}`);
        await syncCurrentJob().catch(() => null);
        try {
          renderAll();
        } catch (renderError) {
          console.error(renderError);
          selectedId = '';
          renderMetrics();
          renderTable();
          renderReports();
        }
        return campaign;
      } catch (error) {
        document.getElementById('metrics').innerHTML = '';
        document.getElementById('tableWrap').innerHTML = `<div class="subtitle" style="padding:18px">Impossible de charger les executions NewForm : ${esc(error.message || error)}</div>`;
        const reportCards = document.getElementById('reportCards');
        if (reportCards) reportCards.innerHTML = '';
        return null;
      }
    }

    async function syncCurrentJob() {
      const payload = await fetchJsonWithLocalFallback('/api/jobs/current').catch(() => null);
      const job = payload?.job;
      if (job && (job.status === 'running' || job.status === 'queued')) {
        currentJobId = job.id;
        currentRunMode = job.mode || 'all';
        showRunMessage(`Execution deja en cours : ${job.totalSchools || 0} ecole(s). Tu peux l arreter avec Stop.`);
        pollJob();
        return;
      }
      const qaPayload = await fetchJsonWithLocalFallback('/api/qa-jobs').catch(() => null);
      const qaJob = qaPayload?.running;
      if (qaJob && (qaJob.status === 'running' || qaJob.status === 'queued')) {
        currentQaJobId = qaJob.id;
        scenarioRunStatus = 'En cours';
        updateLiveBrowser(qaJob, { forceOpen: true });
        renderLiveExecution(qaJob);
        showRunMessage(`${liveExecutionTypeLabel(qaJob)} en cours : ${qaJob.scenario || qaJob.campaign || 'execution agent'}.`);
        pollQaJob();
        return;
      }
      currentJobId = '';
      currentRunMode = '';
    }

    async function runCampaign(mode, schoolSlug = '', campaignId = selectedCampaignId(), scenarioConfig = null) {
      showRunMessage('Demarrage de l execution...');
      try {
        const response = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode, schoolSlug, autoPayment: true, campaignId, scenarioConfig }),
        });
        const job = await response.json().catch(() => ({}));
        if (!response.ok) {
          if ((job.error || '').includes('deja en cours')) {
            await syncCurrentJob();
            renderAll(false);
          }
          showRunMessage(job.error || 'Impossible de lancer l execution.', 'error');
          return;
        }
        currentJobId = job.id;
        currentRunMode = mode;
        showRunMessage(`Execution lancee : ${job.totalSchools || 0} ecole(s). Le bouton devient Stop pendant le run.`);
        renderAll(false);
        pollJob();
      } catch (error) {
        showRunMessage(`Impossible de contacter le serveur dashboard : ${error.message || error}`, 'error');
      }
    }

    async function runJourney(mode = 'school', schoolSlug = '', campaignId = selectedCampaignId(), scenarioConfig = null) {
      showRunMessage('Demarrage du parcours NewForm + Eudonet...');
      try {
        const response = await fetch('/api/journey-execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode, schoolSlug, autoPayment: true, campaignId, scenarioConfig }),
        });
        const job = await response.json().catch(() => ({}));
        if (!response.ok) {
          if ((job.error || '').includes('deja en cours')) {
            await syncCurrentJob();
            renderAll(false);
          }
          showRunMessage(job.error || 'Impossible de lancer le parcours NewForm + Eudonet.', 'error');
          return;
        }
        currentJobId = job.id;
        currentRunMode = mode;
        showRunMessage(`Parcours lance : ${job.totalSchools || 0} ecole(s).`);
        renderAll(false);
        pollJob();
      } catch (error) {
        showRunMessage(`Impossible de contacter le serveur dashboard : ${error.message || error}`, 'error');
      }
    }

    async function pollJob() {
      if (!currentJobId) return;
      const job = await fetch(`/api/jobs/${currentJobId}`, { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
      if (!job) return;
      if (job.status === 'running' || job.status === 'queued') setTimeout(pollJob, 2200);
      else {
        currentJobId = '';
        currentRunMode = '';
        showRunMessage('Execution terminee. Les resultats sont rafraichis.');
        loadCampaign();
      }
    }

    async function pollQaJob() {
      if (!currentQaJobId) return;
      const job = await fetch(apiUrl(`/api/qa-jobs/${encodeURIComponent(currentQaJobId)}`), { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
      if (!job) return;
      updateLiveBrowser(job);
      if (job.status === 'running' || job.status === 'queued') {
        setTimeout(pollQaJob, 2200);
        return;
      }
      currentQaJobId = '';
      scenarioRunStatus = job.status === 'completed' ? 'Termine' : job.status === 'stopped' ? 'Bloque' : 'KO';
      scenarioModalMessage = job.errorMessage || (scenarioRunStatus === 'Termine' ? 'Execution terminee. Les resultats sont rafraichis.' : 'Execution terminee avec anomalie.');
      scenarioModalMessageType = scenarioRunStatus === 'Termine' ? 'success' : 'error';
      showRunMessage(scenarioModalMessage, scenarioModalMessageType === 'error' ? 'error' : '');
      renderScenarioLauncher();
      loadCampaign();
    }

    async function stopCurrentJob() {
      if (!currentJobId) return;
      const jobId = currentJobId;
      try {
        await fetch(`/api/jobs/${jobId}/stop`, { method: 'POST' });
      } catch {
        // Le rafraichissement local reste utile si le serveur ne repond pas.
      }
      currentJobId = '';
      currentRunMode = '';
      showRunMessage('Demande d arret envoyee. Les resultats sont rafraichis.');
      renderAll(false);
      loadCampaign();
    }

    document.getElementById('envFilter')?.addEventListener('change', (event) => {
      currentEnvironment = normalizeEnv(event.target.value || 'REC');
      selectedId = '';
      loadCampaign();
    });
    ['statusFilter', 'searchInput'].forEach((id) => document.getElementById(id).addEventListener('input', () => renderAll(false)));
    document.getElementById('heroLaunchBtn')?.addEventListener('click', () => runCampaign(document.getElementById('heroRunMode')?.value || 'all'));
    document.getElementById('heroReplayBtn')?.addEventListener('click', () => runCampaign(document.getElementById('heroRunMode')?.value || 'all'));
    document.getElementById('heroStopBtn')?.addEventListener('click', stopCurrentJob);
    document.getElementById('menuNewFormBtn')?.addEventListener('click', () => runCampaign(document.getElementById('heroRunMode')?.value || 'all'));
    document.getElementById('menuJourneyBtn')?.addEventListener('click', () => {
      const selectedSchool = document.getElementById('railEudonetSchool')?.value || selectedScenarioSchool() || '';
      runJourney(selectedSchool ? 'school' : 'all', selectedSchool);
    });
    document.getElementById('menuScenarioBtn')?.addEventListener('click', openScenarioModal);
    document.getElementById('railEudonetSchool')?.addEventListener('change', (event) => {
      const found = tests().find((test) => test.schoolSlug === event.target.value);
      if (found) {
        selectedId = found.id;
        renderAll(false);
      }
    });
    document.getElementById('railEudonetLaunchBtn')?.addEventListener('click', () => runCampaign('school', document.getElementById('railEudonetSchool')?.value || ''));
    document.getElementById('railEudonetReplayBtn')?.addEventListener('click', () => runCampaign('school', document.getElementById('railEudonetSchool')?.value || ''));
    document.getElementById('railEudonetStopBtn')?.addEventListener('click', stopCurrentJob);
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('envFilter').value = 'REC';
      currentEnvironment = 'REC';
      document.getElementById('statusFilter').value = '';
      document.getElementById('searchInput').value = '';
      selectedId = '';
      loadCampaign();
    });
    (function trackDashboardUsage() {
      try {
        const key = 'qa-dashboard-session-id';
        let id = localStorage.getItem(key);
        if (!id) {
          id = `sess-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          localStorage.setItem(key, id);
        }
        fetch('/api/dashboard-usage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: id, page: 'newform' })
        }).catch(() => {});
      } catch (error) {}
    })();
    loadCampaign();
  </script>
</body>
