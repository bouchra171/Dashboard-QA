<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard QA</title>
  <link rel="stylesheet" href="./assets/omnes-consulting.css">
  <style>
    :root {
      --bg: #fbfbfd;
      --panel: #fff;
      --ink: #15112a;
      --muted: #746f84;
      --line: #e8e5ee;
      --purple: #4b1261;
      --purple-soft: #f6f2f8;
      --ok: #4a7a5f;
      --ok-soft: #f1f7f3;
      --ko: #9a5261;
      --ko-soft: #faf0f2;
      --blocked: #8a6a3f;
      --blocked-soft: #faf6ef;
      --shadow: 0 10px 28px rgba(24, 5, 46, .06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 420px at 78% 0%, rgba(75,18,97,.08), rgba(75,18,97,0) 62%),
        linear-gradient(180deg, #ffffff 0%, #fbf9fd 42%, #f7f3fa 100%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 206px minmax(0, 1fr); }
    aside {
      min-height: 100vh;
      background: linear-gradient(180deg, #21003d, #17002b);
      padding: 24px 12px 18px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .brand { display: grid; place-items: center; padding: 8px 6px 20px; }
    .brand img { width: 128px; display: block; }
    .nav { display: grid; gap: 7px; }
    .nav a, .nav-title {
      height: 46px; border-radius: 10px; color: rgba(255,255,255,.82);
      display: grid; grid-template-columns: 1fr 14px; align-items: center;
      padding: 0 12px; text-decoration: none; font-size: 12px; font-weight: 700;
    }
    .nav a:not(.has-caret) { grid-template-columns: 1fr; }
    .nav a.active {
      background: linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.04)), linear-gradient(90deg, #4b1261, #35104a);
      color: #fff;
      box-shadow: inset 3px 0 0 rgba(255,255,255,.58);
    }
    .icon { display: none; }
    .subnav { display: grid; gap: 4px; padding-left: 38px; }
    .subnav a, .subnav span { min-height: 32px; border-radius: 7px; display: flex; align-items: center; padding: 0 10px; color: rgba(255,255,255,.72); font-size: 12px; font-weight: 700; text-decoration: none; }
    .subnav a.active { background: rgba(255,255,255,.1); color: #fff; }
    .subnav span { opacity: .42; }

    main { min-width: 0; min-height: 100vh; }
    main.detail-open { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
    .page { padding: 34px 36px 34px; min-width: 0; }
    .detail { display: none; border-left: 1px solid var(--line); background: #fff; padding: 30px 24px; min-width: 0; }
    main.detail-open .detail { display: block; }
    .top {
      position: relative;
      min-height: 220px;
      border: 1px solid rgba(33,0,61,.08);
      border-radius: 10px;
      background:
        radial-gradient(560px 180px at 72% 112%, rgba(75,18,97,.08), rgba(75,18,97,0) 62%),
        linear-gradient(135deg, #fff 0%, #fff 56%, #f5f0f8 100%);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(300px, .78fr) minmax(440px, 1.22fr);
      align-items: stretch;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }
    .top:after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08), rgba(255,255,255,0) 34%),
        linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(75,18,97,.08) 100%);
    }
    .hero-title {
      position: relative;
      z-index: 1;
      padding: 34px 34px;
      display: flex;
      align-items: center;
    }
    .hero-title h1 {
      color: #15112a;
      max-width: 330px;
      text-shadow: none;
      font-size: 27px;
      line-height: 1.1;
      font-weight: 650;
    }
    .hero-title:before {
      content: "";
      position: absolute;
      left: 34px;
      top: 52px;
      width: 72px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffffff, rgba(255,255,255,.16));
    }
    .hero-eyebrow {
      width: max-content;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px 9px 9px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      color: rgba(255,255,255,.92);
      font-size: 12px;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.13);
    }
    .hero-eyebrow span {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #fff;
      color: #21003d;
      font-size: 12px;
      font-weight: 850;
    }
    .hero-copy {
      margin: -12px 0 0;
      max-width: 300px;
      color: rgba(255,255,255,.76);
      font-size: 15px;
      line-height: 1.5;
    }
    .hero-execution {
      max-width: 300px;
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.72);
    }
    .hero-execution label {
      color: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 800;
    }
    .hero-execution select {
      height: 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 0 12px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }
    .hero-execution option { color: #21003d; }
    .hero-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .hero-action {
      min-height: 40px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      background: rgba(255,255,255,.09);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    .hero-action.primary {
      border-color: rgba(255,255,255,.32);
      background: linear-gradient(180deg, #ffffff, #efe7f4);
      color: #21003d;
      box-shadow: 0 12px 24px rgba(0,0,0,.14);
    }
    .hero-execution small {
      color: rgba(255,255,255,.65);
      font-size: 12px;
      line-height: 1.45;
    }
    .hero-visual {
      position: relative;
      z-index: 1;
      background-color: #f1edf4;
      clip-path: none;
      min-height: 0;
      margin: 18px 18px 18px 0;
      border: 1px solid rgba(33,0,61,.08);
      border-radius: 10px;
      box-shadow:
        0 18px 36px rgba(33,0,61,.12),
        inset 0 0 0 1px rgba(255,255,255,.72);
    }
    .hero-visual img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center 68%;
    }
    .hero-visual:after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(90deg, rgba(255,255,255,.2), rgba(255,255,255,0) 42%),
        linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
      pointer-events: none;
    }
    h1 { margin: 0; font-size: 27px; line-height: 1.1; font-weight: 650; color: #15112a; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(150px, .8fr) minmax(150px, .8fr) minmax(240px, 1.35fr) auto;
      gap: 14px;
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid rgba(33,0,61,.08);
      border-radius: 18px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 18px 46px rgba(33,0,61,.07);
      backdrop-filter: blur(10px);
    }
    .field {
      height: 54px;
      background: #fff;
      border: 1px solid #e4deea;
      border-radius: 12px;
      padding: 8px 13px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 8px 18px rgba(24,5,46,.035);
    }
    .field label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 5px; font-weight: 750; }
    select, input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }
    .btn {
      min-height: 48px;
      border: 1px solid #ded8e4;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      padding: 0 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(33,0,61,.045);
    }
    .btn:hover { background: #f8f5fa; border-color: #d5c9dc; }
    .btn.primary { background: #21003d; border-color: #21003d; color: #fff; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
    .metric {
      background:
        linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.92));
      border: 1px solid rgba(33,0,61,.08);
      border-radius: 18px;
      padding: 20px;
      min-height: 118px;
      box-shadow: 0 18px 42px rgba(33,0,61,.075);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
    }
    .micon { display: none; }
    .metric h3 { margin: 0; color: var(--muted); font-size: 12px; font-weight: 850; }
    .metric strong { display: block; margin-top: 7px; font-size: 30px; color: #21003d; letter-spacing: 0; }
    .metric small { display: none; }
    .metric-run {
      position: relative;
      min-width: 104px;
      min-height: 42px;
      border-radius: 999px;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: 12px;
      font-weight: 900;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .metric-run:before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 5px;
      height: 38%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.08));
      pointer-events: none;
    }
    .metric-run:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 13px 22px rgba(75, 18, 97, .22);
    }
    .metric-run.btn.primary {
      border: 1px solid #5d1b73;
      background:
        radial-gradient(circle at 14% 62%, rgba(255,255,255,.95), rgba(255,255,255,0) 18%),
        linear-gradient(180deg, #7a3a8e 0%, #4b1261 48%, #2b0640 100%);
      color: #ffffff;
      text-shadow: 0 1px 0 rgba(0,0,0,.15);
      box-shadow:
        inset 0 3px 7px rgba(255,255,255,.55),
        inset 0 -5px 10px rgba(33,0,61,.26),
        0 9px 18px rgba(75, 18, 97, .22);
    }
    .metric-run:not(.primary) {
      border-color: #d8d1df;
      background:
        linear-gradient(180deg, #ffffff 0%, #f7f4f9 100%);
      color: var(--purple);
      box-shadow: inset 0 2px 5px rgba(255,255,255,.78), 0 8px 16px rgba(33,0,61,.08);
    }
    .panel {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(33,0,61,.08);
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(33,0,61,.075);
      margin-bottom: 18px;
      overflow: hidden;
    }
    .run-message {
      display: none;
      margin: -10px 0 18px;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid #eaddec;
      background: #fbf7fc;
      color: var(--purple);
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 700;
    }
    .run-message.show { display: block; }
    .run-message.error {
      border-color: #ead6dc;
      background: #fbf3f5;
      color: #7d4754;
    }
    .panel-head { padding: 20px 22px 0; display: flex; justify-content: space-between; align-items: center; }
    .panel h2 { margin: 0; font-size: 17px; color: #21003d; }
    .table-panel {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.99)),
        radial-gradient(circle at 4% 0%, rgba(75,18,97,.08), transparent 28%);
      border: 1px solid rgba(33,0,61,.08);
      border-radius: 20px;
      box-shadow: 0 22px 56px rgba(24, 5, 46, .09);
      overflow: hidden;
      padding: 16px;
    }
    .table-panel:before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, #21003d, #6e2a82, rgba(110,42,130,0));
    }
    .table-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 6px 18px;
    }
    .table-title { display: block; }
    .table-title strong { display: block; font-size: 20px; letter-spacing: -.01em; color: #21003d; }
    .table-title span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #eee8f2;
      border-radius: 16px;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
    }
    table {
      width: 100%;
      min-width: 930px;
      border-collapse: separate;
      border-spacing: 0;
    }
    thead th {
      height: 50px;
      background: #fbf8fc;
      border-bottom: 1px solid var(--line);
      color: #7a7188;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .075em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    th, td {
      padding: 0 18px;
      text-align: left;
      font-size: 12px;
      vertical-align: middle;
    }
    tbody td {
      height: 72px;
      border-bottom: 1px solid #eeeaf2;
      color: #251d38;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr {
      cursor: default;
      transition: background-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    tbody tr:hover {
      background: #fcfafd;
      box-shadow: 0 12px 24px rgba(33, 0, 61, .07), inset 0 0 0 999px rgba(75,18,97,.015);
      transform: translateY(-2px);
    }
    tr.selected {
      background: linear-gradient(90deg, #f8f2fb, #fff);
      box-shadow: inset 3px 0 0 #4b1261;
    }
    th:last-child, td:last-child { text-align: right; }
    .school-cell {
      appearance: none;
      position: relative;
      display: inline-flex;
      align-items: center;
      min-width: 190px;
      min-height: 38px;
      padding: 0 14px 0 16px;
      border-radius: 12px;
      background: linear-gradient(90deg, #fbf8fc, rgba(255,255,255,0));
      border: 1px solid transparent;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .school-cell:before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 999px;
      background: #4b1261;
      opacity: .72;
    }
    .school-cell:hover {
      transform: translateY(-3px);
      background: #fff;
      border-color: #eaddec;
      box-shadow: 0 12px 24px rgba(75, 18, 97, .09);
    }
    .school-name { display: block; font-weight: 800; color: #15112a; letter-spacing: -.01em; }
    .step-cell { color: #4d455f; }
    .duration-cell, .date-cell { font-variant-numeric: tabular-nums; color: #332b46; }
    .badge {
      display: inline-flex;
      min-width: 50px;
      height: 26px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .ok { color: var(--ok); background: var(--ok-soft); }
    .ko { color: var(--ko); background: var(--ko-soft); }
    .blocked { color: var(--blocked); background: var(--blocked-soft); }
    .pending { color: #706a7a; background: #f3f0f5; }
    .proof-icon { color: var(--purple); text-decoration: none; font-weight: 800; }
    .env-badge {
      color: var(--purple);
      background: #f7f2fa;
      border: 1px solid #ece2f1;
    }
    .actions-cell { text-align: right; }
    .detail-btn {
      min-width: 88px;
      min-height: 36px;
      border-radius: 999px;
      color: var(--purple);
      background: #fff;
      border-color: #ddd4e5;
      font-weight: 800;
    }
    .detail-btn:hover {
      background: #f7f2fa;
      border-color: #cfc0d9;
      box-shadow: 0 8px 18px rgba(75, 18, 97, .08);
    }
    .empty-table {
      min-height: 170px;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #fbfafc);
    }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 18px 22px 22px; }
    .report-card {
      border: 1px solid rgba(33,0,61,.08);
      border-radius: 14px;
      padding: 14px;
      min-height: 124px;
      background: linear-gradient(180deg, #fff, #fbf9fc);
      box-shadow: 0 10px 24px rgba(33,0,61,.055);
    }
    .thumb { height: 42px; width: 78px; border: 1px solid var(--line); border-radius: 8px; background: #f5f3f7; margin-bottom: 10px; }
    .report-card strong { display: block; font-size: 12px; }
    .report-card p { margin: 3px 0 8px; color: var(--muted); font-size: 11px; }
    .priority-card {
      min-height: 118px;
    }
    .priority-card strong {
      color: #17002b;
      font-size: 13px;
    }
    .priority-step {
      min-height: 32px;
      margin: 6px 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .priority-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .priority-actions .btn {
      min-height: 34px;
      padding: 0 10px;
      font-size: 12px;
    }
    .detail-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
    .detail h2 { margin: 0; font-size: 18px; }
    .close { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); }
    .tabs { display: flex; gap: 14px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; overflow-x: auto; }
    .tabs button {
      padding: 0 0 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }
    .tabs .active { color: var(--purple); border-bottom-color: var(--purple); }
    .detail-section { margin-bottom: 16px; }
    .detail-section h3 { margin: 0 0 7px; font-size: 12px; }
    .detail-section p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .detail-panel { display: grid; gap: 14px; }
    .detail-message {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid #eee7f3;
      border-radius: 8px;
      background: #fcfafe;
      color: #3a2c49;
      font-size: 12px;
      line-height: 1.55;
    }
    .detail-message p { margin: 0; }
    .proof-box { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fbfafc; }
    .proof-box img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); display: block; }
    .proof-list { display: grid; gap: 10px; }
    .proof-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      display: grid;
      gap: 8px;
    }
    .proof-card strong { color: #21003d; font-size: 12px; }
    .proof-card span { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .proof-card img { width: 100%; max-height: 150px; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; }
    .jdd-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: table;
      font-size: 11px;
    }
    .jdd-table th, .jdd-table td {
      padding: 9px 10px;
      border-bottom: 1px solid #f0ebf4;
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
    }
    .jdd-table th { background: #fcfafe; color: #21003d; font-weight: 850; }
    .jdd-table td:first-child { color: #3a2c49; font-weight: 750; width: 42%; }
    .jdd-table tr:last-child td { border-bottom: 0; }
    .jdd-actions { grid-template-columns: 1fr 1fr; }
    .detail-actions { display: grid; gap: 8px; margin-top: 12px; }
    .detail-actions a, .detail-actions button { min-height: 40px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; text-decoration: none; font-size: 12px; font-weight: 650; }
    .jira { margin-top: 18px; width: 100%; min-height: 46px; border-radius: 6px; background: #090d36; color: #fff; border: 0; font-weight: 700; }
    .log { max-height: 220px; overflow: auto; background: #111827; color: #eef2ff; border-radius: 6px; padding: 12px; font-size: 11px; }
    .shell {
      display: block;

    }
    .shell > aside {
      display: none;
    }
    main {
      min-height: 100vh;
      background:
        radial-gradient(880px 420px at 78% 2%, rgba(75,18,97,.08), rgba(75,18,97,0) 64%),
        linear-gradient(118deg, #21003d 0%, #260044 28%, #fbf9fd 28.2%, #fff 100%);
    }
    main.detail-open {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
    }
    .page.newform-execution {
      min-height: 100vh;
      padding: 32px 36px 34px;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 34px;
      align-items: start;
    }
    .execution-rail {
      position: sticky;
      top: 28px;
      min-height: calc(100vh - 64px);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 20px 0 0;
    }
    .back-home {
      width: max-content;
      max-width: 100%;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 850;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
    }
    .back-home:hover {
      background: rgba(255,255,255,.18);
    }
    .rail-title {
      margin: 0;
      width: max-content;
      max-width: 100%;
      color: #fff;
      font-size: 52px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      font-family: "Omnes", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(90deg, #ffffff 0%, #f3e6ff 48%, #c98cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 18px 34px rgba(0,0,0,.22);
      position: relative;
      padding-bottom: 14px;
    }
    .rail-title:after {
      content: "";
      position: absolute;
      left: 2px;
      bottom: 0;
      width: 78px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff, #b45cff);
      box-shadow: 0 8px 20px rgba(180,92,255,.28);
    }
    .rail-copy {
      margin: -12px 0 0;
      max-width: 265px;
      color: rgba(255,255,255,.82);
      font-size: 18px;
      line-height: 1.45;
    }
    .rail-execution {
      margin-top: 0;
      width: 344px;
      max-width: 100%;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.64);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(246,239,250,.9));
      box-shadow: 0 24px 48px rgba(33,0,61,.22), inset 0 1px 0 rgba(255,255,255,.9);

    .rail-execution label {
      display: block;
      margin-bottom: 10px;
      color: #2a0642;

      height: 48px;

      color: #2a0642;
      font-size: 14px;

      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(239,232,246,.92));

    .rail-eudonet label:after {
      content: "Controle cible";

    .rail-action.primary {

      padding: 0;
      border: 0;

      margin-bottom: 20px;

    .execution-card .metric {
      min-height: 116px;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 16px 38px rgba(33,0,61,.075);

    .execution-card .metric h3 {

    .execution-card .metric strong {

    .execution-card .metric.is-ko strong { color: #9a5261; }
    .execution-card .metric.is-blocked strong { color: #8a6a3f; }
    .execution-card .metric.is-pending strong { color: #706a7a; }
    .execution-card .metric.is-total strong { color: #21003d; }
    .execution-card .table-panel {
      padding: 0;
      border-radius: 14px;
      box-shadow: none;
      background: #fff;
    }
    .execution-card .table-panel:before { display: none; }
    .execution-card .table-heading {

    }
    .execution-card .table-title strong {

    }
    .execution-card tbody td {

    }
    .execution-card .school-cell {
      min-height: 28px;
      padding: 0;

    }
    .execution-card .school-cell:before { display: none; }
    .execution-card .school-cell:hover {
      transform: translateY(-1px);
      box-shadow: none;
    }
    .execution-card .panel {
      margin-top: 18px;

    }
    .execution-card .panel-head {

    .execution-card .cards {

    }
    .execution-card .report-card {
      display: flex;
      flex-direction: column;

    .execution-card .report-card div:last-child {

    @media (max-width: 1180px) {
      main.detail-open { grid-template-columns: 1fr; }
      .detail { border-left: 0; border-top: 1px solid var(--line); }
      .page.newform-execution { grid-template-columns: 1fr; }
      .execution-rail { position: relative; top: auto; min-height: auto; }
      .rail-execution { margin-top: 0; }
      .toolbar, .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .page.newform-execution { padding: 18px; gap: 20px; }
      .execution-card { padding: 0 18px 20px; }
      .execution-hero { margin: 0 -18px; }
      .execution-card .toolbar,
      .execution-card .metrics,
      .execution-card .cards { grid-template-columns: 1fr; }
      .rail-title { font-size: 42px; }
    }
  </style>
</head>

          </div>

          </div>

        <div class="toolbar">
          <div class="field"><label>Environnement</label><select id="envFilter"><option value="REC">REC</option><option value="INT">INTÉGRATION</option><option value="PREPROD">PRÉPROD</option></select></div>
          <div class="field"><label>Resultat</label><select id="statusFilter"><option value="">Tous</option><option value="passed">OK</option><option value="failed">KO</option><option value="blocked">Bloque</option><option value="pending">Non lance</option></select></div>
          <div class="field"><label>Ecole</label><input id="searchInput" placeholder="Rechercher une école"></div>
          <button class="btn" id="resetBtn">Reinitialiser</button>

      <aside class="detail" id="detailPanel"></aside>

  <div id="scenarioModalHost"></div>
  <div id="liveBrowserHost"></div>

  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace('http://127.0.0.1:4173/newform.html');
    }

    let campaign = null;
    let selectedId = '';
    let currentJobId = '';
    let currentRunMode = '';
    let currentViewMode = 'full';
    let currentEnvironment = normalizeEnv(document.getElementById('envFilter')?.value || 'REC');
    let currentQaJobId = '';
    let scenarioModalOpen = false;
    let lastScenarioConfig = null;
    let scenarioRunStatus = '';
    let scenarioModalMessage = '';
    let scenarioModalMessageType = '';
    let scenarioSource = 'squash';
    let scenarioSquashSelection = { lot: '', campaign: '', scenario: '' };
    let squashScenarioOptions = [];
    let squashCampaignOptions = [];
    let squashCatalogLoadedFor = '';
    let squashModalLoading = false;
    let squashModalMessage = '';
    let jiraScenarioIssues = [];
    let jiraScenarioProject = '';
    let currentManualPlan = null;
    let manualScenarioQueue = [];
    let manualQueueRunning = false;
    let activeDetailTab = 'resume';
    let jiraState = {};
    let anomalyPage = 0;
    const anomalyPageSize = 5;
    let liveBrowserState = null;
    let liveBrowserMode = 'embedded';
    let liveBrowserEventSource = null;
    let liveBrowserClosedForExecutionId = '';

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const localServerBase = window.location.protocol === 'file:' ? 'http://127.0.0.1:4173' : '';
    const localUrl = (value) => {
      const url = String(value || '');
      if (!url || /^(https?:|data:|\.\/|\.\.\/)/i.test(url)) return url;
      return url.startsWith('/') ? `${localServerBase}${url}` : url;
    };
    const statusLabel = { passed: 'OK', failed: 'KO', blocked: 'Bloque', pending: 'Non lance', running: 'En cours' };
    const statusClass = { passed: 'ok', failed: 'ko', blocked: 'blocked', pending: 'pending', running: 'pending' };

    function apiUrl(path) {
      const value = String(path || '');
      if (/^https?:\/\//i.test(value)) return value;
      return `${localServerBase}${value.startsWith('/') ? value : `/${value}`}`;
    }

    function normalizeTextValue(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function bindFileLinks(root = document) {
      root.querySelectorAll('[data-open-file]').forEach((link) => {
        link.addEventListener('click', (event) => {
          const href = link.getAttribute('href');
          if (!href) event.preventDefault();
        });
      });
    }

    function renderLiveExecution(job) {
      if (job) updateLiveBrowser(job, { forceOpen: true });
    }

    function tests() { return Array.isArray(campaign?.tests) ? campaign.tests : []; }
    function normalizeEnv(value) {
      const text = String(value || '').toUpperCase();
      if (text.includes('INT')) return 'INT';
      if (text.includes('PRE')) return 'PREPROD';
      return 'REC';
    }

    function selectedCampaignId() {
      return campaignIdFromEnvironment(currentEnvironment);
    }

    function campaignIdFromEnvironment(environment) {
      const env = normalizeEnv(environment);
      if (env === 'INT') return 'tnr-front-integration';
      if (env === 'PREPROD') return 'tnr-front-preprod';
      return 'tnr-front-recette';
    }
    function filteredTests() {
      const status = document.getElementById('statusFilter').value;
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      return tests().filter((test) => {
        if (status && test.status !== status) return false;
        if (search && !`${test.school} ${test.schoolSlug}`.toLowerCase().includes(search)) return false;
        return true;
      });
    }
    function newformStep(test) {
      if (test.status === 'running') return { label: 'En cours', className: 'pending' };
      if (test.status === 'passed') return { label: 'OK', className: 'ok' };
      if (test.status === 'failed') return { label: 'KO', className: 'ko' };
      if (test.status === 'blocked') return { label: 'Bloque', className: 'blocked' };
      return { label: 'Non lance', className: 'pending' };
    }
    function eudonetStep(test) {
      if (test.eudonetStatus) {
        return { label: statusLabel[test.eudonetStatus] || String(test.eudonetStatus), className: statusClass[test.eudonetStatus] || 'pending' };
      }
      return { label: 'Non lance', className: 'pending' };
    }
    function parcoursResult(test) {
      if (test.status === 'failed' && test.eudonetStatus === 'failed') return { label: 'Echec NewForm + Eudonet', className: 'ko' };
      if (test.status === 'blocked') return { label: 'Bloque NewForm', className: 'blocked' };
      if (test.status === 'failed') return { label: 'Echec NewForm', className: 'ko' };
      if (test.status === 'passed' && test.eudonetStatus === 'passed') return { label: 'Succes', className: 'ok' };
      if (test.status === 'passed' && test.eudonetStatus === 'failed') return { label: 'Echec Eudonet', className: 'ko' };
      if (test.status === 'passed' && test.eudonetStatus === 'blocked') return { label: 'Bloque Eudonet', className: 'blocked' };
      if (test.status === 'passed') return { label: 'Eudonet non lance', className: 'pending' };
      return { label: 'Non lance', className: 'pending' };
    }

    function renderMetrics() {
      const rows = filteredTests();
      const newformOk = rows.filter((t) => t.status === 'passed').length;
      const newformKo = rows.filter((t) => t.status === 'failed').length;
      const newformBlocked = rows.filter((t) => t.status === 'blocked').length;
      const eudonetLaunched = rows.filter((t) => Boolean(t.eudonetStatus)).length;
      const eudonetOk = rows.filter((t) => t.eudonetStatus === 'passed').length;
      const eudonetKo = rows.filter((t) => t.eudonetStatus === 'failed').length;
      const eudonetBlocked = rows.filter((t) => t.eudonetStatus === 'blocked').length;
      const eudonetNotRun = rows.filter((t) => !t.eudonetStatus).length;
      const parcoursSuccess = rows.filter((t) => t.status === 'passed' && t.eudonetStatus === 'passed').length;
      const items = [
        { label: 'Ecoles testees', value: rows.length, tone: 'total' },
        { label: 'NewForm OK', value: newformOk, tone: 'ok' },
        { label: 'Eudonet controles', value: eudonetLaunched, tone: 'total' },
        { label: 'Parcours succes', value: parcoursSuccess, tone: 'ok' },
        { label: 'NewForm KO', value: newformKo, tone: 'ko' },
        { label: 'NewForm bloques', value: newformBlocked, tone: 'blocked' },
        { label: 'Eudonet OK', value: eudonetOk, tone: 'ok' },
        { label: 'Eudonet KO', value: eudonetKo, tone: 'ko' },
        { label: 'Eudonet non lances', value: eudonetNotRun, tone: 'pending' },
      ];
      document.getElementById('metrics').innerHTML = items.map((item) => `
        <article class="metric is-${esc(item.tone)}">
          <div><h3>${esc(item.label)}</h3><strong>${esc(item.value)}</strong></div>
        </article>
      `).join('');
      renderRailEudonetPicker();
    }

    function renderRailEudonetPicker() {
      const select = document.getElementById('railEudonetSchool');
      if (!select) return;
      const current = select.value || selectedTest().schoolSlug || tests()[0]?.schoolSlug || '';
      select.innerHTML = tests().map((test) => `
        <option value="${esc(test.schoolSlug || '')}" ${test.schoolSlug === current ? 'selected' : ''}>${esc(test.school || test.schoolSlug || '-')}</option>
      `).join('') || '<option value="">Aucune ecole disponible</option>';
    }

    function renderTable() {
      const rows = filteredTests();
      const fullMode = currentViewMode === 'full';
      if (rows.length && !rows.some((test) => test.id === selectedId)) {
        selectedId = rows[0].id;
      }
      if (!rows.length) {
        document.getElementById('tableWrap').innerHTML = `
          <div class="table-heading">
            <div class="table-title"><strong>${fullMode ? 'Résultats' : 'Résultats NewForm'}</strong></div>
          </div>
          <div class="empty-table">Aucune ecole ne correspond aux filtres selectionnes.</div>`;
        return;
      }
      const columns = fullMode
        ? '<col style="width: 22%"><col style="width: 12%"><col style="width: 14%"><col style="width: 17%"><col style="width: 14%"><col style="width: 15%"><col style="width: 6%">'
        : '<col style="width: 25%"><col style="width: 13%"><col style="width: 20%"><col style="width: 14%"><col style="width: 12%"><col style="width: 12%"><col style="width: 4%">';
      const headers = fullMode
        ? '<th>Ecole</th><th>NewForm</th><th>Eudonet</th><th>Resultat parcours</th><th>Environnement</th><th>Derniere execution</th><th>Details</th>'
        : '<th>Ecole</th><th>Statut</th><th>Etape bloquante</th><th>Environnement</th><th>Duree</th><th>Derniere execution</th><th>Details</th>';
      document.getElementById('tableWrap').innerHTML = `
        <div class="table-heading">
          <div class="table-title"><strong>${fullMode ? 'Résultats' : 'Résultats NewForm'}</strong></div>
        </div>
        <div class="table-scroll"><table class="results-table">
        <colgroup>${columns}</colgroup>
        <thead><tr>${headers}</tr></thead>

    function selectedScenarioSchool() {
      const selected = tests().find((test) => test.id === selectedId) || tests()[0] || null;

    function normalizeText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function detectSchoolFromScenarioText(text) {
      const normalized = normalizeText(text);
      if (!normalized) return null;
      const aliases = [
        ['mastersinseec', ['inseec msc', 'msc inseec', 'masters inseec', 'formulaire msc', 'ecole msc']],
        ['bachelorsinseec', ['inseec bachelor', 'bachelor inseec', 'formulaire bachelor']],
        ['supdepub', ['sup de pub', 'supdepub']],
        ['supdecreation', ['sup de crea', 'sup de creation', 'supdecreation']],
        ['inseecbba', ['inseec bba', 'bba inseec']],
        ['international', ['international']],
        ['ium', ['ium', 'monaco']],
        ['ece', ['ece']],
        ['heip', ['heip']],
        ['isbe', ['inseec grande ecole', 'grande ecole']],
        ['inseecbts', ['inseec bts', 'bts']],
      ];
      const match = aliases.find(([, names]) => names.some((name) => normalized.includes(normalizeText(name))));
      if (!match) return null;
      return tests().find((test) => test.schoolSlug === match[0]) || null;
    }

    async function loadSquashScenariosForModal(environment = '', { live = false, refresh = false, force = false } = {}) {
      const env = normalizeEnv(environment || document.getElementById('scenarioEnv')?.value || document.getElementById('railEudonetEnv')?.value || document.getElementById('heroRunEnv')?.value || 'REC');
      const cacheKey = `${env}::${live ? 'live' : 'cache'}`;
      if (!force && squashCatalogLoadedFor === cacheKey && squashCampaignOptions.length) return;
      squashCatalogLoadedFor = cacheKey;
      squashModalLoading = live;
      squashModalMessage = live
        ? 'Actualisation Squash en cours : recuperation des lots, campagnes et scenarios NewForm.'
        : squashModalMessage;
      squashScenarioOptions = [];
      squashCampaignOptions = [];
      try {
        const url = live
          ? `/api/squash-catalog?live=1&all=1&refresh=${refresh ? '1' : '0'}&project=${encodeURIComponent('NewForm')}&environment=${encodeURIComponent(env)}`
          : `/api/squash-catalog?project=${encodeURIComponent('NewForm')}&environment=${encodeURIComponent(env)}`;
        const payload = await fetchJsonWithLocalFallback(url);
        const projects = Array.isArray(payload.projects) ? payload.projects : [];
        const newformProjects = projects.filter((item) => /newform|formulaire|fdc/i.test(`${item.name || ''} ${item.application || ''}`));
        const project = newformProjects.find((item) => Array.isArray(item.campaigns) && item.campaigns.length)
          || projects.find((item) => Array.isArray(item.campaigns) && item.campaigns.length)
          || newformProjects[0]
          || projects[0];
        squashCampaignOptions = (Array.isArray(project?.campaigns) ? project.campaigns : []).map((campaignItem) => ({
          id: campaignItem.id || campaignItem.name,
          name: campaignItem.name || campaignItem.id || '',
          project: project.name || project.application || 'NewForm',
          environment: campaignItem.environment || env,
          lot: campaignItem.lot || campaignItem.lotId || 'Sans lot',
          lotId: campaignItem.lotId || campaignItem.lot || 'Sans lot',
          scenarios: Array.isArray(campaignItem.scenarios) ? campaignItem.scenarios : [],
        }));
        const options = [];
        for (const campaignItem of squashCampaignOptions) {
          for (const scenario of campaignItem.scenarios) {
            const id = `${campaignItem.id || campaignItem.name}::${scenario.id || scenario.name}`;
            options.push({
              id,
              project: campaignItem.project,
              name: scenario.name || scenario.id || 'Scenario Squash',
              label: `${campaignItem.lot || campaignItem.lotId || 'Sans lot'} / ${campaignItem.name || campaignItem.id || 'Campagne'} / ${scenario.name || scenario.id || 'Scenario Squash'}`,
              scenarioId: scenario.id || scenario.name || '',
              campaign: campaignItem.name || campaignItem.id || '',
              environment: campaignItem.environment || env,
              lot: campaignItem.lot || '',
              lotId: campaignItem.lotId || '',
            });
          }
        }
        squashScenarioOptions = options.slice(0, 80);
        const lotCount = scenarioSquashLots().length;
        squashModalMessage = lotCount
          ? `Squash branche : ${lotCount} lot(s) / dossier(s), ${squashCampaignOptions.length} campagne(s), ${squashScenarioOptions.length} scenario(s) recuperes.`
          : 'Aucun lot Squash NewForm trouve pour cet environnement. Lance une actualisation Squash si le cache est vide.';
        if (payload?.warning) squashModalMessage = `${squashModalMessage} ${payload.warning}`;
      } catch (error) {
        squashScenarioOptions = [];
        squashCampaignOptions = [];
        squashModalMessage = `Lecture Squash impossible : ${error.message || error}`;
      } finally {
        squashModalLoading = false;
      }
    }

    function scenarioSquashProjects() {
      return ['NewForm'];
    }

    function scenarioSquashLots() {
      const lots = new Map();
      squashCampaignOptions.forEach((campaignItem) => {
        const lot = campaignItem.lot || campaignItem.lotId || 'Sans lot';
        lots.set(lot, lot);
      });
      return Array.from(lots.keys());
    }

    function scenarioSquashCampaigns(lot) {
      return squashCampaignOptions.filter((campaignItem) => {
        const campaignLot = campaignItem.lot || campaignItem.lotId || 'Sans lot';
        return lot && campaignLot === lot;
      });
    }

    function scenarioSquashCampaignById(campaignId) {
      return squashCampaignOptions.find((campaignItem) => campaignItem.id === campaignId || campaignItem.name === campaignId) || null;
    }

    function scenarioSquashScenarios(campaignId) {
      const campaignItem = scenarioSquashCampaignById(campaignId);
      return Array.isArray(campaignItem?.scenarios) ? campaignItem.scenarios : [];
    }

    function scenarioSquashOptionBySelection(campaignId, scenarioId) {
      const campaignItem = scenarioSquashCampaignById(campaignId);
      if (!campaignItem) return null;
      const scenario = scenarioId
        ? (campaignItem.scenarios || []).find((item) => item.id === scenarioId || item.name === scenarioId)
        : null;
      const id = `${campaignItem.id || campaignItem.name}::${scenario?.id || scenario?.name || ''}`;
      return {
        id,
        project: 'NewForm',
        name: scenario?.name || '',
        scenarioId: scenario?.id || scenario?.name || '',
        campaign: campaignItem.name || campaignItem.id || '',
        campaignId: campaignItem.id || campaignItem.name || '',
        environment: campaignItem.environment || '',
        lot: campaignItem.lot || campaignItem.lotId || '',
        lotId: campaignItem.lotId || campaignItem.lot || '',
      };

      if (source === 'squash' || job.type === 'squash') return 'Squash';

      if (job.mode === 'school') return 'Execution classique';
      if (job.mode === 'all' || job.mode === 'failed' || job.mode === 'blocked') return 'Campagne classique';

        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenarioConfig: config }),
      });
      const payload = await response.json().catch(() => ({}));

      return payload.understoodPlan || null;

    function queueStatusLabel(status) {
      return status === 'ready' ? 'Pret a lancer'

          : status === 'running' ? 'En cours'
            : status === 'success' ? 'Succes'
              : status === 'failed' ? 'KO'
                : status === 'blocked' ? 'Bloque'
                  : status || '-';
    }

    function queueStatusClass(status) {
      if (status === 'success' || status === 'ready') return 'ok';
      if (status === 'failed' || status === 'blocked') return 'ko';
      return 'pending';
    }

    function manualBusinessStatusForConfig(config = {}) {
      const row = tests().find((test) => (
        test.schoolSlug === config.schoolSlug
        || normalizeTextValue(test.school || '') === normalizeTextValue(config.school || '')
      ));
      const status = String(row?.manualScenario?.status || '').toUpperCase();
      if (status === 'OK') return { status: 'success', reason: '' };
      if (status === 'KO') return { status: 'failed', reason: row?.manualScenario?.businessConclusion || 'Scenario termine avec anomalie metier.' };
      if (status.includes('BLO')) return { status: 'blocked', reason: row?.manualScenario?.businessConclusion || 'Scenario bloque.' };
      return null;
    }

    async function analyzeCurrentManualPlan() {
      const config = readScenarioConfigFromModal();
      if (config.source !== 'manual') return null;
      currentManualPlan = await analyzeManualScenarioConfig(config);
      lastScenarioConfig = { ...config, understoodPlan: currentManualPlan };
      return currentManualPlan;

    async function addCurrentManualScenarioToQueue() {
      const config = readScenarioConfigFromModal();
      if (config.source !== 'manual') return;
      if (!config.customScenario && !config.manualScenario?.title) {
        throw new Error('Renseigne le scenario personnalise avant de l ajouter a la file.');
      }
      const plan = currentManualPlan || await analyzeManualScenarioConfig(config);
      const id = `manual-${Date.now()}-${manualScenarioQueue.length + 1}`;
      manualScenarioQueue.push({
        id,
        index: manualScenarioQueue.length + 1,
        config: { ...config, understoodPlan: plan },
        plan,
        status: plan.valid ? 'ready' : 'blocked',
        reason: plan.valid ? '' : plan.blockedReason,
        jobId: '',
      });
      currentManualPlan = null;
      lastScenarioConfig = {
        ...config,
        scenario: '',
        manualScenario: {
          title: '',
          description: '',
          scenarioText: '',
          dataToUse: '',
          comment: '',
        },
        customScenario: '',
        understoodPlan: null,
      };
      scenarioModalMessage = plan.valid
        ? 'Scenario ajoute a la file. Tu peux renseigner le scenario suivant.'
        : 'Scenario ajoute a la file, mais bloque car une etape est non supportee. Tu peux renseigner le scenario suivant.';
      scenarioModalMessageType = plan.valid ? 'success' : 'error';
      renderScenarioModal();
    }

    async function runQueuedManualScenario(item) {
      if (!item?.plan?.valid || manualQueueRunning) return;
      currentEnvironment = normalizeEnv(item.config?.environment || currentEnvironment || 'REC');
      manualQueueRunning = true;
      item.status = 'running';
      item.reason = '';
      renderScenarioModal();
      try {
        const job = await startManualScenarioJob(item.config);
        item.jobId = job.id || '';
        currentQaJobId = job.id || '';
        updateLiveBrowser(job, { forceOpen: true });
        while (item.jobId) {
          const polled = await fetch(apiUrl(`/api/qa-jobs/${item.jobId}`), { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
          if (!polled) break;
          currentQaJobId = item.jobId;
          updateLiveBrowser(polled);
          if (!['queued', 'running'].includes(polled.status)) {
            await loadCampaign(true);
            const businessStatus = manualBusinessStatusForConfig(item.config);
            item.status = businessStatus?.status || (polled.status === 'completed' ? 'success' : 'failed');
            item.reason = businessStatus?.reason || (polled.status === 'completed' ? '' : (polled.errorMessage || 'Execution terminee avec anomalie.'));
            break;
          }
          await new Promise((resolve) => setTimeout(resolve, 2200));
        }
      } catch (error) {
        item.status = 'failed';
        item.reason = error.message || 'Execution impossible.';
      } finally {
        manualQueueRunning = false;
        currentQaJobId = '';
        renderScenarioModal();
        loadCampaign(true);
      }
    }

      if (manualQueueRunning) return;
      const items = manualScenarioQueue.filter((item) => item.plan?.valid && ['ready', 'queued', 'failed'].includes(item.status));
      for (const item of items) {
        await runQueuedManualScenario(item);
      }

    function readScenarioConfigFromModal() {
      const source = document.getElementById('scenarioSource')?.value || scenarioSource || 'squash';
      let schoolSlug = document.getElementById('scenarioSchool')?.value || selectedScenarioSchool();
      let school = tests().find((test) => test.schoolSlug === schoolSlug);
      const selectedJiraKey = document.getElementById('scenarioJiraTicket')?.value || '';
      const jiraIssue = jiraScenarioIssues.find((issue) => issue.key === selectedJiraKey) || null;
      const squashLot = document.getElementById('scenarioSquashLot')?.value || '';
      const squashCampaign = document.getElementById('scenarioSquashCampaign')?.value || '';
      const squashId = document.getElementById('scenarioSquash')?.value || '';
      const selectedSquashCampaign = scenarioSquashCampaignById(squashCampaign);
      const squashScenario = scenarioSquashOptionBySelection(squashCampaign, squashId);
      const manualText = document.getElementById('manualScenarioText')?.value.trim() || '';
      const manualTitle = document.getElementById('manualTitle')?.value.trim() || '';
      const inferredManualTitle = manualTitle || manualText.split(/\r?\n/).map((line) => line.trim()).find(Boolean)?.slice(0, 90) || '';
      const manualScenario = {
        title: inferredManualTitle,
        description: manualText,
        scenarioText: manualText,
        dataToUse: '',
        comment: '',
      };
      if (source === 'manual') {
        const detectedSchool = detectSchoolFromScenarioText(`${manualTitle}\n${manualText}`);
        if (detectedSchool) {
          school = detectedSchool;
          schoolSlug = detectedSchool.schoolSlug || schoolSlug;
          if (document.getElementById('scenarioSchool') && document.getElementById('scenarioSchool').value !== schoolSlug) {
            document.getElementById('scenarioSchool').value = schoolSlug;
          }
        }
      }
      const config = {
        environment: document.getElementById('scenarioEnv')?.value || 'REC',
        school: school?.school || schoolSlug || '-',
        schoolSlug,
        source,
        options: {
          captureProof: Boolean(document.getElementById('scenarioCaptureProof')?.checked),
          generateReport: Boolean(document.getElementById('scenarioGenerateReport')?.checked),
          updateResultsTable: Boolean(document.getElementById('scenarioUpdateResults')?.checked),
          detectPointsToTreat: Boolean(document.getElementById('scenarioDetectPoints')?.checked),
        },
      };
      if (source === 'jira') {
        config.scenario = jiraIssue ? `${jiraIssue.key} - ${jiraIssue.title}` : 'Ticket Jira';
        config.jira = {
          project: jiraScenarioProject || 'NewForm',
          ticketKey: jiraIssue?.key || selectedJiraKey,
          ticketTitle: jiraIssue?.title || '',
          ticketUrl: jiraIssue?.url || '',
          priority: jiraIssue?.priority || '',
          status: jiraIssue?.status || '',
        };
      } else if (source === 'squash') {
        config.scenario = squashScenario?.name || selectedSquashCampaign?.name || 'Campagne Squash';
        config.squashScenario = squashScenario;
        config.squash = {
          project: 'NewForm',
          lot: squashLot || selectedSquashCampaign?.lot || '',
          campaign: selectedSquashCampaign?.name || squashCampaign || '',
          campaignId: selectedSquashCampaign?.id || squashCampaign || '',
          scenario: squashScenario?.name || '',
          scenarioId: squashScenario?.scenarioId || '',
        };
      } else {
        config.scenario = manualScenario.title || 'Scenario personnalise';
        config.manualScenario = manualScenario;
        config.customScenario = manualScenario.description || manualScenario.title || '';
        if (currentManualPlan) config.understoodPlan = currentManualPlan;
      }
      return config;
    }

    async function launchConfiguredScenario() {
      if (isScenarioExecutionRunning()) return;
      const config = readScenarioConfigFromModal();
      currentEnvironment = normalizeEnv(config.environment || currentEnvironment || 'REC');
      if (config.source === 'jira' && !config.jira?.ticketKey) {
        showRunMessage('Selectionne un ticket Jira avant de lancer.', 'error');
        return;
      }
      if (config.source === 'squash' && !config.squash?.campaign) {
        showRunMessage('Selectionne un lot et une campagne Squash avant de lancer.', 'error');
        return;
      }
      if (config.source === 'manual' && !config.manualScenario?.title && !config.manualScenario?.description) {
        showRunMessage('Decris le scenario a executer avant de lancer.', 'error');
        return;
      }
      if (config.source === 'manual') {
        try {
          const plan = currentManualPlan || await analyzeManualScenarioConfig(config);
          currentManualPlan = plan;
          config.understoodPlan = plan;
          if (!plan.valid) {
            scenarioModalMessage = plan.blockedReason || "L'agent a detecte une etape non supportee.";
            scenarioModalMessageType = 'error';
            showRunMessage(scenarioModalMessage, 'error');
            renderScenarioModal();
            return;
          }
        } catch (error) {
          scenarioModalMessage = error.message || 'Analyse du scenario impossible.';
          scenarioModalMessageType = 'error';
          showRunMessage(scenarioModalMessage, 'error');
          renderScenarioModal();
          return;
        }
      }
      lastScenarioConfig = config;
      scenarioRunStatus = 'En cours';
      scenarioModalMessage = 'Preparation de l execution du scenario...';
      scenarioModalMessageType = '';
      selectedId = tests().find((test) => test.schoolSlug === config.schoolSlug)?.id || selectedId;
      showRunMessage(`Lancement du scenario personnalise interprete "${config.scenario}" pour ${config.school}.`);
      renderScenarioLauncher();
      renderScenarioModal();

      if (config.source === 'squash') {
        await runSquashScenarioFromModal(config);
      } else if (config.source === 'manual') {
        await runManualScenarioFromModal(config);
      } else {
        await runCustomAgentScenario(config);
      }
    }

    function customScenarioNeedsEudonet(config) {
      const text = `${config.scenario || ''} ${config.customScenario || ''}`.toLowerCase();
      return /eudonet|crm|candidat.*retrouv|controle/.test(text);
    }

    async function runCustomAgentScenario(config) {
      const campaignId = campaignIdFromEnvironment(config.environment);
      if (customScenarioNeedsEudonet(config)) {
        await runJourney('school', config.schoolSlug, campaignId, config);
      } else {
        await runCampaign('school', config.schoolSlug, campaignId, config);
      }
    }

    async function startManualScenarioJob(config) {
      const response = await fetch(apiUrl('/api/manual-scenario-execution'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenarioConfig: config }),
      });
      const job = await response.json().catch(() => ({}));
      if (response.status === 404) {
        throw new Error('Endpoint scenario personnalise introuvable. Redemarre le serveur Node pour charger la nouvelle logique.');
      }
      if (!response.ok) {
        if (job.understoodPlan) currentManualPlan = job.understoodPlan;
        throw new Error(job.error || 'Impossible de lancer le scenario personnalise.');
      }
      return job;
    }

    async function runManualScenarioFromModal(config) {
      try {
        const job = await startManualScenarioJob(config);
        currentQaJobId = job.id;
        scenarioRunStatus = 'En cours';
        scenarioModalMessage = `Execution lancee : ${config.scenario}.`;
        scenarioModalMessageType = 'success';
        showRunMessage(`Scenario personnalise interprete lance : ${config.scenario}.`);
        updateLiveBrowser(job, { forceOpen: true });
        renderLiveExecution(job);
        renderScenarioLauncher();
        pollQaJob();
      } catch (error) {
        scenarioRunStatus = 'KO';
        scenarioModalMessage = error.message || 'Impossible de lancer le scenario personnalise.';
        scenarioModalMessageType = 'error';
        showRunMessage(error.message || 'Impossible de lancer le scenario personnalise.', 'error');
        renderScenarioLauncher();
      }
    }

            scenarioConfig: config,
          }),
        });

    function anomalyKey(anomaly) {
      return [
        anomaly.schoolName,
        anomaly.environment,
        anomaly.module,
        anomaly.anomalyType,
        anomaly.errorMessage,
        anomaly.scenario,
      ]
        .map((value) => String(value || '').trim().toLowerCase())
        .join('|');
    }

    function detectedAnomalies() {
      const rows = filteredTests();
      const anomalies = [];
      for (const test of rows) {
        const result = parcoursResult(test);
        if (result.label === 'Succes') continue;
        const environment = campaign?.environment || test.environment || 'REC';
        const base = {
          testId: test.id,
          schoolName: test.school || test.schoolSlug || '-',
          environment,
          newformStatus: newformStep(test).label,
          eudonetStatus: eudonetStep(test).label,
          resultStatus: result.label,
          executionDate: test.executedAtHuman || test.executedAt || '',
          reportUrl: test.reportUrl || test.reportPath || '',
          proofUrl: test.proofUrl || '',
          jddUrl: test.jddUrl || test.jddPath || '',
          errorMessage: test.suspectedCause || test.summary || test.journeyMessage || test.error || '',
          scenario: test.scenario || test.scenarioName || campaign?.title || '',
        };
        if (test.status === 'failed') {
          anomalies.push({ ...base, module: 'NewForm', anomalyType: 'Echec NewForm' });
          continue;
        }
        if (test.status === 'blocked') {
          anomalies.push({ ...base, module: 'NewForm', anomalyType: 'Blocage NewForm' });
          continue;
        }
        if (test.status === 'passed' && test.eudonetStatus === 'failed') {
          anomalies.push({ ...base, module: 'Eudonet', anomalyType: 'Echec Eudonet' });
        }
      }
      return anomalies;
    }

    function anomalyCriticality(anomaly) {
      if (/blocage/i.test(anomaly.anomalyType || '')) return 'Bloquant';
      if (/echec/i.test(anomaly.anomalyType || '')) return 'Majeur';
      return 'Mineur';
    }

    function criticalityBadgeClass(value) {
      if (value === 'Bloquant') return 'blocked';
      if (value === 'Majeur') return 'ko';
      return 'pending';
    }

    function jiraBusinessStatus(state) {
      const category = String(state?.jiraStatusCategory || '').toLowerCase();
      const status = String(state?.jiraStatus || '').trim();
      if (!state) return 'A creer';
      if (state.status === 'loading') return 'Creation...';
      if (state.status === 'error') return 'Erreur Jira';
      if (category === 'done' || /resolu|résolu|done|clos|termine|terminé/i.test(status)) return 'Resolu';
      return status || 'Ouvert';
    }

    function jiraStatusHtml(anomaly) {
      const state = jiraState[anomalyKey(anomaly)];
      if (!state) return '<span class="badge pending">A creer</span>';
      if (state.status === 'loading') return '<span class="badge pending">Creation...</span>';
      if (state.status === 'error') return '<span class="badge ko">Erreur Jira</span>';
      if (state.alreadyExists) {
        return `<a class="jira-link" href="${esc(state.jiraUrl || '#')}" target="_blank" rel="noopener"><span class="badge pending">Existant</span> Ticket deja cree pour le meme bug : ${esc(state.jiraKey || '-')}</a>`;
      }
      const businessStatus = jiraBusinessStatus(state);
      const badgeClass = businessStatus === 'Resolu' ? 'ok' : 'pending';
      return `<a class="jira-link" href="${esc(state.jiraUrl || '#')}" target="_blank" rel="noopener"><span class="badge ${esc(badgeClass)}">${esc(businessStatus)}</span> Ticket cree : ${esc(state.jiraKey || '-')}</a>`;
    }

    function jiraActionHtml(anomaly) {
      const key = anomalyKey(anomaly);
      const state = jiraState[key];
      if (state?.jiraUrl && state?.jiraKey) {
        return `<div class="jira-actions"><a class="btn detail-btn" href="${esc(state.jiraUrl)}" target="_blank" rel="noopener">Consulter / modifier</a></div>`;
      }
      const label = state?.status === 'error' ? 'Reessayer' : 'Creer dans Jira';
      const disabled = state?.status === 'loading' ? 'disabled' : '';
      return `<div class="jira-actions"><button class="btn detail-btn" data-create-jira="${esc(key)}" type="button" ${disabled}>${esc(label)}</button></div>`;
    }

    function anomalyForTest(test) {
      return detectedAnomalies().find((anomaly) => anomaly.testId === test.id) || null;
    }

    function detailJiraActionHtml(test) {
      const anomaly = anomalyForTest(test);
      if (!anomaly) return '';
      const key = anomalyKey(anomaly);
      const state = jiraState[key];
      if (state?.jiraUrl && state?.jiraKey) {
        const label = state.alreadyExists ? 'Ticket Jira deja cree pour ce probleme' : 'Ticket cree';
        return `<a class="jira" href="${esc(state.jiraUrl)}" target="_blank" rel="noopener">${esc(label)} : ${esc(state.jiraKey)}</a>`;
      }
      const label = state?.status === 'loading'
        ? 'Creation Jira...'
        : state?.status === 'error'
          ? 'Erreur Jira - Reessayer'
          : 'Creer dans Jira';
      const disabled = state?.status === 'loading' ? 'disabled' : '';
      const login = state?.status === 'error'
        ? '<button class="jira" data-open-jira-login type="button">Ouvrir connexion Jira</button>'
        : '';
      return `<button class="jira" data-detail-create-jira="${esc(key)}" type="button" ${disabled}>${esc(label)}</button>${login}`;
    }

    function renderReports() {
      const anomalies = detectedAnomalies();
      const target = document.getElementById('reportCards');
      if (!target) return;
      if (!anomalies.length) {
        target.innerHTML = '<div class="subtitle" style="padding:14px">Aucune anomalie detectee pour le filtre actuel.</div>';
        return;
      }
      const maxPage = Math.max(0, Math.ceil(anomalies.length / anomalyPageSize) - 1);
      if (anomalyPage > maxPage) anomalyPage = maxPage;
      const visibleAnomalies = anomalies.slice(anomalyPage * anomalyPageSize, anomalyPage * anomalyPageSize + anomalyPageSize);
      target.innerHTML = `
        <div class="anomaly-pager">
          <span>${esc(anomalyPage * anomalyPageSize + 1)}-${esc(Math.min((anomalyPage + 1) * anomalyPageSize, anomalies.length))} / ${esc(anomalies.length)}</span>
          <button type="button" data-anomaly-page="prev" ${anomalyPage <= 0 ? 'disabled' : ''}>‹</button>
          <button type="button" data-anomaly-page="next" ${anomalyPage >= maxPage ? 'disabled' : ''}>›</button>
        </div>
        <div class="anomaly-table-wrap">
          <table class="anomaly-table">
            <thead><tr>
              <th>Ecole</th><th>Environnement</th><th>Type anomalie</th><th>Date execution</th><th>Criticite</th><th>Statut Jira</th><th>Action</th>

    async function createJiraIssue(anomaly) {
      const key = anomalyKey(anomaly);
      jiraState = { ...jiraState, [key]: { status: 'loading' } };
      renderReports();
      renderDetail();
      try {
        const response = await fetch(apiUrl('/api/jira/create-issue'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(anomaly),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.success) throw new Error(payload.message || 'Erreur Jira');
        jiraState = {
          ...jiraState,
          [key]: {
            status: 'created',
            alreadyExists: Boolean(payload.alreadyExists),
            jiraKey: payload.jiraKey,
            jiraUrl: payload.jiraUrl,
            jiraStatus: payload.jiraStatus,
            jiraStatusCategory: payload.jiraStatusCategory,
          },
        };
      } catch (error) {
        jiraState = { ...jiraState, [key]: { status: 'error', message: error.message || 'Erreur Jira' } };
        showRunMessage(error.message || 'Erreur Jira', 'error');
      }
      renderReports();
      renderDetail();
    }

    async function openJiraLogin() {
      showRunMessage('Ouverture de la fenetre Jira pour connexion...');
      try {
        const response = await fetch(apiUrl('/api/jira-login'), { method: 'POST' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok) throw new Error(payload.message || 'Ouverture Jira impossible');
        showRunMessage(payload.message || 'Fenetre Jira ouverte. Connecte-toi puis reessaie la creation du ticket.');
      } catch (error) {
        showRunMessage(error.message || 'Ouverture Jira impossible', 'error');
      }
    }

    function eudonetBusinessLabelForDetail(test) {
      if (test.eudonetStatus === 'running') return 'En cours';
      if (test.eudonetStatus === 'passed') return 'OK';
      if (test.eudonetStatus === 'failed') return 'KO';
      if (test.eudonetStatus === 'blocked') return 'Bloque';
      return 'Non lance';
    }

    function detailCheckClass(status) {
      const text = String(status || '').toUpperCase();
      if (text === 'OK' || text === 'PASSED' || text === 'REUSSI') return 'ok';
      if (text === 'KO' || text === 'FAILED' || text === 'ECHEC') return 'ko';
      if (text === 'BLOQUE' || text === 'BLOCKED') return 'blocked';
      return 'pending';
    }

    function detailIssueChecks(checks = []) {
      return checks.filter((check) => String(check.status || '').toUpperCase() !== 'OK');
    }

    function detailAllEudonetChecks(report) {
      if (!report) return [];
      return [
        ...(report.programChoiceChecks || []),
        ...(report.identificationChecks || []),
        ...(report.educationChecks || []),
        ...(report.documentChecks || []),
        ...(report.recapChecks || []),
      ];
    }

    function detailJddValue(test, champ) {
      const rows = Array.isArray(test.jddData?.rows) ? test.jddData.rows : [];
      return rows.find((row) => row.champ === champ)?.valeur || '';
    }

    function detailEudonetReason(test) {
      const report = test.eudonetReport;
      if (!report) {
        return test.status === 'passed'
          ? 'le controle Eudonet n a pas encore ete lance pour cette execution.'
          : 'le controle Eudonet est ignore tant que NewForm n est pas OK.';
      }
      const failed = detailAllEudonetChecks(report).find((check) => String(check.status || '').toUpperCase() === 'KO');
      if (!report.recordOpened) {
        return report.candidateVisible
          ? 'le candidat est trouve dans la liste Eudonet, mais la fiche candidat ne s ouvre pas.'
          : 'le candidat genere depuis NewForm n a pas ete retrouve dans Eudonet.';
      }
      if (report.blockingReason) return report.blockingReason;
      if (failed) return `${failed.label || 'un controle'} : ${failed.detail || 'valeur non retrouvee'}`;
      if (report.status === 'OK') return 'le candidat et les donnees controlees sont retrouves dans Eudonet.';
      return test.journeyMessage || report.searchDetail || 'le controle Eudonet doit etre relu.';
    }

    function detailCsvEscape(value) {
      const text = String(value ?? '');
      return /[",\n;]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function downloadDetailJdd(test, format) {
      const rows = Array.isArray(test.jddData?.rows) ? test.jddData.rows : [];
      if (!rows.length) return;
      const safeSchool = String(test.schoolSlug || test.school || 'newform').replace(/[^a-z0-9_-]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase();
      const content = format === 'csv'
        ? `Champ;Valeur\n${rows.map((row) => `${detailCsvEscape(row.champ)};${detailCsvEscape(row.valeur)}`).join('\n')}`
        : JSON.stringify(rows, null, 2);
      const blob = new Blob([content], { type: format === 'csv' ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `jdd-${safeSchool}.${format}`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
