<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard QA - OMNES Education</title>
  <link rel="stylesheet" href="./assets/omnes-consulting.css">
  <style>
    :root {
      --nav: #21003d;
      --nav-dark: #16002b;
      --muted: #756a85;
      --line: #e7e0ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #21003d;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .omnes-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 206px minmax(0, 1fr);
    }

    .omnes-sidebar {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18px 78px, rgba(125,46,190,.38), transparent 90px),
        linear-gradient(180deg, var(--nav), var(--nav-dark));
      color: #fff;
      padding: 24px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .omnes-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px 22px;
      color: #fff;
    }

    .omnes-avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(135deg, #7c2ee8, #5f007f);
      color: #fff;
      font-size: 17px;
      font-weight: 950;
      box-shadow: 0 14px 28px rgba(0,0,0,.18);
    }

    .omnes-brand strong {
      display: block;
      font-size: 16px;
      line-height: 1.1;
      font-weight: 950;
    }

    .omnes-brand span {
      display: block;
      margin-top: 3px;
      color: rgba(255,255,255,.62);
      font-size: 14px;
      font-weight: 700;
    }

    .omnes-footer-logo {
      margin-top: auto;
      display: grid;
      justify-items: start;
      gap: 6px;
      padding: 18px 10px 4px;
      color: rgba(255,255,255,.9);
      font-size: 18px;
      line-height: 1.1;
      font-weight: 750;
    }

    .omnes-footer-logo img {
      width: 132px;
      max-width: 100%;
      display: block;
      filter: brightness(0) invert(1);
    }

    .omnes-nav {
      display: grid;
      gap: 7px;
    }

    .omnes-nav a,
    .omnes-apps-title {
      appearance: none;
      border: 0;
      background: transparent;
      font-family: inherit;
      min-height: 44px;
      border-radius: 8px;
      color: rgba(255,255,255,.8);
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) 14px;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
    }

    .omnes-nav a:not(.has-caret) {
      grid-template-columns: 26px minmax(0, 1fr);
    }

    .omnes-nav a.active {
      color: #fff;
      background: rgba(255,255,255,.11);
      box-shadow: inset 3px 0 0 rgba(255,255,255,.55);
    }

    .omnes-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
    }

    .omnes-icon {
      color: transparent;
      background: transparent;
      opacity: 0;
    }

    .omnes-subnav {
      display: grid;
      gap: 4px;
      padding-left: 42px;
      margin: 2px 0 4px;
    }

    .omnes-subnav.collapsed {
      display: none;
    }

    .omnes-subnav a,
    .omnes-subnav span {
      min-height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      font-weight: 760;
      text-decoration: none;
    }

    .omnes-subnav span {
      opacity: .42;
    }

    .omnes-main {
      min-width: 0;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(33, 0, 61, .045), transparent 26%),
        #fff;
    }

    .omnes-main:before {
      content: "";
      position: fixed;
      right: 5vw;
      top: 250px;
      width: 560px;
      height: 560px;
      border: 72px solid rgba(33, 0, 61, .045);
      border-radius: 50%;
      transform: rotate(-28deg) skewX(-12deg);
      pointer-events: none;
    }

    .overview-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 34px;
    }

    .overview-hero {
      position: relative;
      overflow: hidden;
      min-height: 170px;
      background: #21003d;
      color: #fff;
      padding: 30px 34px;
      display: flex;
      align-items: flex-end;
      box-shadow: 0 18px 40px rgba(33, 0, 61, .08);
    }

    .overview-hero:before,
    .overview-hero:after {
      content: "";
      position: absolute;
      inset: auto auto 0 46%;
      width: 240px;
      height: 180px;
      background: rgba(255, 255, 255, .14);
      transform: skewX(-32deg);
      pointer-events: none;
    }

    .overview-hero:after {
      inset: 0 -70px auto auto;
      height: 210px;
      background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.04));
    }

    .overview-hero h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      color: #fff;
      font-weight: 900;
    }

    .overview-hero p {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      max-width: 620px;
      color: rgba(255,255,255,.74);
      font-size: 13px;
      line-height: 1.5;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .overview-card {
      min-height: 190px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 14px 34px rgba(33, 0, 61, .055);
      padding: 22px;
    }

    .overview-card span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .overview-panels {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 16px;
      margin-top: 16px;
    }

    .overview-panel {
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 14px 34px rgba(33, 0, 61, .055);
      padding: 18px;
    }

    .overview-empty {
      min-height: 150px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 760;
      border: 1px dashed #d8d0e2;
      border-radius: 10px;
      background: #fbfafc;
      color: transparent;
    }

    @media (max-width: 760px) {
      .omnes-shell { grid-template-columns: 1fr; }
      .omnes-sidebar { min-height: auto; }
      .overview-grid,
      .overview-panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="omnes-shell">
    <aside class="omnes-sidebar">
      <div class="omnes-brand">
        <div class="omnes-avatar">QA</div>
        <div>
          <strong>QA Team</strong>
          <span>Pilotage tests</span>
        </div>
      </div>

      <nav class="omnes-nav" aria-label="Navigation QA">
        <a class="active" href="./index.html"><span class="omnes-icon">H</span><span>Vue d'ensemble</span></a>
        <div>
          <button class="omnes-apps-title" id="applicationsToggle" type="button" aria-expanded="true" aria-controls="applicationsMenu"><span class="omnes-icon">A</span><span>Applications</span><span data-caret>v</span></button>
          <div class="omnes-subnav" id="applicationsMenu">
            <a href="./newform.html">NewForm</a>
            <a href="./agate.html">Agate</a>
            <a href="./iris.html">IRIS</a>
            <span>YPAREO</span>
          </div>
        </div>
        <div>
          <button class="omnes-apps-title" id="dashboardToggle" type="button" aria-expanded="true" aria-controls="dashboardMenu"><span class="omnes-icon">T</span><span>Tableau de bord</span><span data-caret>v</span></button>
          <div class="omnes-subnav" id="dashboardMenu">
            <a href="./qa-agent.html#anomalies">Anomalies</a>
            <a href="./qa-agent.html#reports">Rapports</a>
            <a href="./qa-agent.html#kpi">KPI</a>
          </div>
        </div>
        <a href="./qa-agent.html#settings"><span class="omnes-icon">P</span><span>Parametres</span></a>
      </nav>
      <div class="omnes-footer-logo">
        <img src="./assets/omnes-logo.svg" alt="OMNES Education">
        <span>Education</span>
      </div>
    </aside>

    <main class="omnes-main">
      <section class="overview-page">
        <div class="overview-hero">
          <div>
            <h1>Vue d'ensemble</h1>
          </div>
        </div>

        <div class="overview-grid">
          <article class="overview-card"><span>Applications</span></article>
          <article class="overview-card"><span>Executions</span></article>
          <article class="overview-card"><span>Anomalies</span></article>
          <article class="overview-card"><span>Rapports</span></article>
        </div>

        <div class="overview-panels">
          <section class="overview-panel">
            <div class="overview-empty"><span></span></div>
          </section>
          <section class="overview-panel">
            <div class="overview-empty"><span></span></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace('http://127.0.0.1:4173/index.html');
    }

    function bindMenuToggle(buttonId, menuId) {
      document.getElementById(buttonId)?.addEventListener('click', () => {
      const menu = document.getElementById(menuId);
      const button = document.getElementById(buttonId);
      const collapsed = menu?.classList.toggle('collapsed');
      button?.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      const caret = button?.querySelector('[data-caret]');
      if (caret) caret.textContent = collapsed ? '>' : 'v';
      });
    }

    bindMenuToggle('applicationsToggle', 'applicationsMenu');
    bindMenuToggle('dashboardToggle', 'dashboardMenu');
  </script>
</body>
</html>
