<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard QA - OMNES Education</title>
  <link rel="stylesheet" href="./assets/omnes-consulting.css">
  <style>
    :root {
      /* ★ PALETTE VIOLETTE DOUCE PREMIUM OMNES */
      --bg-main: #FAF8FF;
      --bg-secondary: #F4F0FF;
      --bg-card: #FFFEFF;
      --border: #E6DDF5;
      --violet-primary: #5B3FA3;
      --violet-hover: #4A3287;
      --violet-light: #EFE8FF;
      --text-primary: #241B3A;
      --text-secondary: #6F6680;

      /* Statuts */
      --status-ok: #267A52;
      --status-ok-light: #EAF7F0;
      --status-ko: #9B4D63;
      --status-ko-light: #FAEEF2;
      --status-warning: #8A6A3F;
      --status-warning-light: #FAF3E7;
      --status-info: #5B3FA3;
      --status-info-light: #EFE8FF;

      --shadow-sm: 0 1px 2px rgba(91, 63, 163, .05);
      --shadow-md: 0 4px 12px rgba(91, 63, 163, .08);
      --shadow-lg: 0 12px 24px rgba(91, 63, 163, .1);

      /* Rétrocompatibilité */
      --color-primary: var(--violet-primary);
      --color-bg-primary: var(--bg-card);
      --color-bg-secondary: var(--bg-secondary);
      --color-text-primary: var(--text-primary);
      --color-border: var(--border);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--color-text-primary);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .omnes-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 206px minmax(0, 1fr);
      color: var(--text-primary);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .omnes-sidebar {
      min-height: 100vh;
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 24px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }

    .omnes-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px 22px;
      color: var(--text-primary);
    }

    .omnes-avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--violet-light);
      color: var(--violet-primary);
      font-size: 17px;
      font-weight: 950;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(91, 63, 163, .08);
    }

    .omnes-brand strong {
      display: block;
      font-size: 16px;
      line-height: 1.1;
      font-weight: 950;
      color: var(--text-primary);
    }

    .omnes-brand span {
      display: block;
      margin-top: 3px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
    }

    .omnes-footer-logo {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 22px 10px 8px;
      color: var(--text-secondary);
      line-height: 1.1;
      font-weight: 750;
      text-align: center;
    }

    .omnes-logo-mark {
      position: relative;
      width: 58px;
      height: 38px;
      display: block;
    }

    .omnes-logo-mark:before,
    .omnes-logo-mark:after {
      content: "";
      position: absolute;
      inset: 4px 8px;
      border: 10px solid var(--violet-primary);
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 999px;
      transform: rotate(-18deg);
    }

    .omnes-logo-mark:after {
      inset: 12px 11px 0 5px;
      border-color: transparent transparent var(--violet-hover) var(--violet-hover);
      opacity: .72;
    }

    .omnes-logo-name {
      display: block;
      color: var(--text-primary);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .03em;
    }

    .omnes-logo-sub {
      display: block;
      margin-top: 3px;
      color: var(--text-primary);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .34em;
    }

    .omnes-nav {
      display: grid;
      gap: 7px;
    }

    .omnes-nav a,
    .omnes-apps-title {
      appearance: none;
      border: 0;
      background: transparent;
      font-family: inherit;
      min-height: 44px;
      border-radius: 8px;
      color: var(--text-secondary);
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) 14px;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
      transition: all .2s ease;
    }

    .omnes-nav a:not(.has-caret) {
      grid-template-columns: 26px minmax(0, 1fr);
    }

    .omnes-nav a.active {
      color: var(--violet-primary);
      background: var(--violet-light);
      box-shadow: inset 3px 0 0 var(--violet-primary);
    }

    .omnes-nav a:hover,
    .omnes-apps-title:hover {
      color: var(--violet-primary);
      background: var(--bg-secondary);
    }

    .omnes-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      color: var(--color-nav-text);
      font-size: 11px;
      font-weight: 900;
    }

    .omnes-icon {
      color: transparent;
      background: transparent;
      opacity: 0;
    }

    .omnes-subnav {
      display: grid;
      gap: 4px;
      padding-left: 42px;
      margin: 2px 0 4px;
    }

    .omnes-subnav.collapsed {
      display: none;
    }

    .omnes-subnav a,
    .omnes-subnav span {
      min-height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 760;
      text-decoration: none;
      transition: all .15s ease;
    }

    .omnes-subnav a:hover {
      color: var(--violet-primary);
      background: var(--violet-light);
    }

    .omnes-subnav a.active {
      color: var(--violet-primary);
      background: var(--violet-light);
    }

    .omnes-subnav span {
      opacity: .48;
    }

    .omnes-main {
      min-width: 0;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--bg-main);
    }

    .omnes-main:before {
      content: "";
      position: fixed;
      right: 5vw;
      top: 250px;
      width: 560px;
      height: 560px;
      border: 72px solid rgba(91, 63, 163, .055);
      border-radius: 50%;
      transform: rotate(-28deg) skewX(-12deg);
      pointer-events: none;
    }

    .overview-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 34px;
    }

    .overview-hero {
      position: relative;
      overflow: hidden;
      min-height: 170px;
      background: linear-gradient(135deg, var(--violet-primary) 0%, var(--violet-hover) 100%);
      color: white;
      padding: 30px 34px;
      display: flex;
      align-items: flex-end;
      box-shadow: var(--shadow-lg);
      border-radius: 12px;
    }

    .overview-hero:before,
    .overview-hero:after {
      content: "";
      position: absolute;
      inset: auto auto 0 46%;
      width: 240px;
      height: 180px;
      background: rgba(255, 255, 255, .12);
      transform: skewX(-32deg);
      pointer-events: none;
    }

    .overview-hero:after {
      inset: 0 -70px auto auto;
      height: 210px;
      background: linear-gradient(135deg, rgba(255,255,255,.15), rgba(255,255,255,.05));
    }

    .overview-hero h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      color: white;
      font-weight: 900;
    }

    .overview-hero p {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      max-width: 620px;
      color: rgba(255,255,255,.85);
      font-size: 13px;
      line-height: 1.5;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .overview-card {
      min-height: 190px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-card);
      box-shadow: var(--shadow-md);
      padding: 22px;
      transition: all .3s ease;
    }

    .overview-card:hover {
      border-color: var(--violet-light);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .overview-card span {
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .overview-panels {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 16px;
      margin-top: 16px;
    }

    .overview-panel {
      min-height: 240px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-card);
      box-shadow: var(--shadow-md);
      padding: 18px;
      transition: all .3s ease;
    }

    .overview-panel:hover {
      border-color: var(--violet-light);
      box-shadow: var(--shadow-lg);
    }

    .overview-empty {
      min-height: 150px;
      display: grid;
      place-items: center;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 760;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: var(--bg-secondary);
      color: transparent;
    }

    @media (max-width: 760px) {
      .omnes-shell { grid-template-columns: 1fr; }
      .omnes-sidebar { min-height: auto; }
      .overview-grid,
      .overview-panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="omnes-shell">
    <aside class="omnes-sidebar">
      <div class="omnes-brand">
        <div class="omnes-avatar">QA</div>
        <div>
          <strong>QA Team</strong>
          <span>Pilotage tests</span>
        </div>
      </div>

      <nav class="omnes-nav" aria-label="Navigation QA">
        <a class="active" href="./index.html"><span class="omnes-icon">H</span><span>Vue d'ensemble</span></a>
        <a href="./cockpit-parcours.html"><span class="omnes-icon">P</span><span>Cockpit parcours</span></a>
        <div>
          <button class="omnes-apps-title" id="applicationsToggle" type="button" aria-expanded="true" aria-controls="applicationsMenu"><span class="omnes-icon">A</span><span>Applications</span><span data-caret>v</span></button>
          <div class="omnes-subnav" id="applicationsMenu">
            <a href="./welcome.html">Welcome</a>
            <a href="./newform.html">NewForm</a>
            <a href="./agate.html">Agate</a>
            <a href="./iris.html">IRIS</a>
            <span>YPAREO</span>
          </div>
        </div>
        <div>
          <button class="omnes-apps-title" id="dashboardToggle" type="button" aria-expanded="true" aria-controls="dashboardMenu"><span class="omnes-icon">T</span><span>Tableau de bord</span><span data-caret>v</span></button>
          <div class="omnes-subnav" id="dashboardMenu">
            <a href="./qa-agent.html#anomalies">Anomalies</a>
            <a href="./qa-agent.html#reports">Rapports</a>
            <a href="./qa-agent.html#kpi">KPI</a>
          </div>
        </div>
        <a href="./qa-agent.html#settings"><span class="omnes-icon">P</span><span>Parametres</span></a>
      </nav>
      <div class="omnes-footer-logo">
        <span class="omnes-logo-mark" aria-hidden="true"></span>
        <span>
          <span class="omnes-logo-name">OMNES</span>
          <span class="omnes-logo-sub">EDUCATION</span>
        </span>
      </div>
    </aside>

    <main class="omnes-main">
      <section class="overview-page">
        <div class="overview-hero">
          <div>
            <h1>Vue d'ensemble</h1>
          </div>
        </div>

        <div class="overview-grid">
          <article class="overview-card"><span>Applications</span></article>
          <article class="overview-card"><span>Executions</span></article>
          <article class="overview-card"><span>Anomalies</span></article>
          <article class="overview-card"><span>Rapports</span></article>
        </div>

        <div class="overview-panels">
          <section class="overview-panel">
            <div class="overview-empty"><span></span></div>
          </section>
          <section class="overview-panel">
            <div class="overview-empty"><span></span></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace('http://127.0.0.1:4173/index.html');
    }

    function bindMenuToggle(buttonId, menuId) {
      document.getElementById(buttonId)?.addEventListener('click', () => {
      const menu = document.getElementById(menuId);
      const button = document.getElementById(buttonId);
      const collapsed = menu?.classList.toggle('collapsed');
      button?.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      const caret = button?.querySelector('[data-caret]');
      if (caret) caret.textContent = collapsed ? '>' : 'v';
      });
    }

    bindMenuToggle('applicationsToggle', 'applicationsMenu');
    bindMenuToggle('dashboardToggle', 'dashboardMenu');
  </script>
</body>
</html>
